# Resolved recipe bare-host (chain: base -> tt-par-30b-base -> bare-host)
# recipe_hash: c2c7540ba5eb46bd9993ca78273b79261792d59be2d0477acf4abc198b7ec391 is the sha256 of the YAML below these comment lines
bench:
  items:
  - vecadd_multi_core
  - matmul_multicore_reuse
  - pad_multi_core
  split: dev
  suite: tt-par-v0
directions:
- source: cpp
  target: tt
executor:
  cpp:
    kind: native
  tt:
    arch: wormhole_b0
    dispatch: slow
    kind: ttsim
extract:
  unfenced_file_lines: true
faithful: false
fixes:
  baseline_both: true
  execution_gate: true
  fence_tag: true
  parsed_diagnostics: true
  prompt_newlines: true
  prompt_spaces: true
llm:
  sampling:
    max_tokens: 16384
    temperature: 1.0
    top_p: 0.95
loop:
  correct_on_mismatch: true
  correct_on_sim_gap: true
  max_corrections: 8
model:
  backend: openai_compat
  id: furiosa-ai/gemma-4-31B-it-FP8-block
  timeout_s: 3600
oracle:
  kind: binary_io
  metric: from_item
  shape: elements
  threshold: from_item
project: bare-host
prompts: tt-host-v1
report:
  parquet: true
  trial_md: true
runs_root: /mnt/nvme10/joseph_ufl/lassi-runs
sandbox:
  mem_gb: 16
  network: false
  wall_s: baseline_x10
stages:
- baseline
- generate
- compile_loop
- run_loop
- oracle
toolchain:
  cpp: gcc-native
  tt: ttmetal-host
trials:
  n: 1
