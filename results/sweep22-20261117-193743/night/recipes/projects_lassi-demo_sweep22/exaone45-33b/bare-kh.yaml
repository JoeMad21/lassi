# Resolved recipe bare-kh (chain: base -> tt-par-30b-base -> tt-par-30b-kh-base -> bare-kh)
# recipe_hash: ff11960a671636e0059ef79e2407045145d2ba3da26731aa32c951ef1ead8672 is the sha256 of the YAML below these comment lines
bench:
  items:
  - vecadd_multi_core
  - matmul_multicore_reuse
  - pad_multi_core
  split: dev
  suite: tt-par-v0-kh
directions:
- source: cpp
  target: ttkh
executor:
  cpp:
    kind: native
  tt:
    arch: wormhole_b0
    dispatch: slow
    kind: ttsim
  ttkh:
    arch: wormhole_b0
    dispatch: slow
    kind: ttsim
extract:
  unfenced_file_lines: true
faithful: false
fixes:
  baseline_both: true
  execution_gate: true
  fence_tag: true
  parsed_diagnostics: true
  prompt_newlines: true
  prompt_spaces: true
llm:
  sampling:
    max_tokens: 16384
    temperature: 1.0
    top_p: 0.95
loop:
  correct_on_mismatch: true
  correct_on_sim_gap: true
  max_corrections: 8
model:
  backend: openai_compat
  id: furiosa-ai/EXAONE-4.5-33B-FP8
  timeout_s: 3600
oracle:
  kind: binary_io
  metric: from_item
  shape: elements
  threshold: from_item
project: bare-kh
prompts: tt-kh-v0
report:
  parquet: true
  trial_md: true
runs_root: /mnt/nvme10/joseph_ufl/lassi-runs
sandbox:
  mem_gb: 16
  network: false
  wall_s: baseline_x10
stages:
- baseline
- generate
- compile_loop
- run_loop
- oracle
toolchain:
  cpp: gcc-native
  tt: ttmetal-host
  ttkh: ttmetal-host
trials:
  n: 1
