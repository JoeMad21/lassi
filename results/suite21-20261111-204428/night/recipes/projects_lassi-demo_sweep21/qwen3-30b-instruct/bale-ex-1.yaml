bench:
  items:
  - histo
  - ig
  split: unassigned
  suite: bale-v0-tt
directions:
- source: cpp
  target: ttkh
examples:
  max_chars: 32000
  pack: tt-kh-examples-v0
  prompts:
  - generate
  - correct
executor:
  cpp:
    kind: native
  omp:
    kind: native
  ttkh:
    arch: wormhole_b0
    dispatch: slow
    kind: ttsim
extract:
  unfenced_file_lines: true
faithful: false
fixes:
  baseline_both: false
  execution_gate: true
  fence_tag: true
  parsed_diagnostics: true
  prompt_newlines: true
  prompt_spaces: true
llm:
  sampling:
    max_tokens: 8192
    temperature: 0.7
    top_p: 0.8
loop:
  correct_on_mismatch: true
  correct_on_sim_gap: true
  max_corrections: 8
model:
  backend: openai_compat
  id: furiosa-ai/Qwen3-30B-A3B-Instruct-2507-FP8
  timeout_s: 3600
oracle:
  kind: binary_io
  metric: max_abs
  threshold: 0
project: bale-ex-1
prompts: bale-tt-v0
report:
  parquet: true
  trial_md: true
runs_root: /mnt/nvme10/joseph_ufl/lassi-runs
sandbox:
  mem_gb: 16
  network: false
  wall_s: 300
stages:
- baseline
- generate
- compile_loop
- run_loop
- oracle
toolchain:
  cpp: gcc-native
  omp: gcc-openmp
  ttkh: ttmetal-host
trials:
  n: 1
