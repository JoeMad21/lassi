sandbox:
  mem_gb: 16
  network: false
  wall_s: baseline_x10
stages:
- baseline
- generate
- compile_loop
- run_loop
- oracle
toolchain:
  cpp: gcc-native
  omp: gcc-openmp
trials:
  n: 3
