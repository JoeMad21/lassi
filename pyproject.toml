[project]
name = "lassi"
version = "0.0.0"
description = "One codebase that reproduces LASSI and LASSI-EE and builds LASSI-DF"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "tiktoken==0.14.0",
]

# Framework extras (bible Toolchain Pins, framework pins): one per torch build; they conflict, so an environment
# holds exactly one. A plain `uv sync` installs none of them.
[project.optional-dependencies]
cpu = ["torch==2.14.1", "transformers==5.18.0"]
cuda = ["torch==2.14.1", "transformers==5.18.0"]
rocm = ["torch==2.14.1", "transformers==5.18.0", "triton-rocm==3.8.0 ; sys_platform == 'linux'"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[project.scripts]
lassi = "lassi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests, excluded from the fast suite",
  "remote: needs the remote build host through tools/rx.py",
  "real_tiktoken: keeps the real offline cl100k_base loader instead of the tests' fake encoding (tests/conftest.py)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/server/gate.py" = ["UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lassi"]
