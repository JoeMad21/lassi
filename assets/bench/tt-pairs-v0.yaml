            sha256: 2d5924b5f7d4150fe090e72fe6caaaf501191c88b2b8a2663a67a8fd41cb473e
          kernels/dataflow/writer_unary_interleaved_start_id.cpp:
            upstream: tt_metal/programming_examples/matmul/matmul_multi_core/kernels/dataflow/writer_unary_interleaved_start_id.cpp
            sha256: ac78a2919007fb5dde5052c4eb096e88e582bc8b3bb138b55ef9e5dcb82f8e68
          kernels/compute/mm.cpp:
            upstream: tt_metal/programming_examples/matmul/matmul_multi_core/kernels/compute/mm.cpp
            sha256: 15b9b6f921ecb67d2edeebf2ba3d6fb83446d9023cce6d8cd5dc2d93f6132250
  matmul_single_core:
    split: unassigned
    seed: 4
    # c = a b at upstream's 640 x 640 x 640, uniform [0, 1); the TT program refuses a b that is not square, since
    # upstream's writer arguments agree with the host's only when K == N
    inputs:
      - {name: a, dtype: bf16, shape: [640, 640], dist: uniform, lo: 0.0, hi: 1.0}
      - {name: b, dtype: bf16, shape: [640, 640], dist: uniform, lo: 0.0, hi: 1.0}
    outputs: [c]  # bf16 [640, 640] on both sides
    # PCC above 0.97 against the CPU result, the upstream check; binary_io passes a PCC at or above the threshold
    tolerance: {metric: pcc, threshold: 0.97}
    unpack_to_dest: >-
      not taken: the upstream example sets no fp32_dest_acc_en and no unpack_to_dest_mode and keeps every circular
      buffer Float16_b (P4.9 reading; its ttsim run printed no finding), and the host program written here does the
      same: its one ComputeConfig sets only math_fidelity HiFi4 and compile_args, and its three circular buffers
      (c_0, c_1, c_16) are Float16_b (tests/bench/test_tt_pairs.py checks it)
