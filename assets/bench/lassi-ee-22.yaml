# The LASSI-EE suite (bible Benchmark Suites: lassi-ee-22, single language, eval only; Source Papers, LASSI-EE).
# Sources are pinned by commit and fetched by tools/fetch_bench.py under $LASSI_SCRATCH, never into git.
suite: lassi-ee-22
repo: https://github.com/zjin-lcf/HeCBench
# lassi-hecbench-10's pin (plans/spikes/p1-hecbench-pin.md). The 22 apps are the paper's Table I (arXiv:2505.02184
# v3; plans/spikes/p5-v0-corpus.md, section 4): 20 HeCBench apps, XSBench (HeCBench's xsbench), and miniMDock, which
# HeCBench does not hold. Each sha256 below is that of the file at this commit (HeCBench's GitHub tree and raw
# files, read 2026-10-25); tools/fetch_bench.py refuses a fetch whose files differ.
commit: 692cba32c5744f6ef024cca59f65e9488edba8bf
# Per item, each of omp, cuda, and hip that HeCBench holds at the pin as src/<app>-<language> (its sycl versions are
# not listed). OQ-089 (a): the CPU port runs the 18 items with an omp version; the four without one declare it under
# absent, with the reason, and are named as not ported in every result. The cuda and hip entries serve the GPU arms.
# files: the language directory's own sources (every .cpp, .cu, and .h file in it but reference.h), which a model
# sees and may change. support: harness files of that language's build directory, each {upstream, sha256}: each
# file its Makefile takes from another directory (-I../<app>-cuda, ../<app>-cuda/<file>), under its own name, and
# reference.h, the CPU reference check, in every language, as lassi-hecbench-10 keeps entropy's out of the model's
# files (there as item-level support; here per language, so each carries a sha256 that tools/fetch_bench.py checks).
# run_args [DESIGN]: the arguments of the app's Makefile run target at the pin (`$(LAUNCHER) ./$(program) <args>`),
# the same in every language, and an empty list where it passes none; lassi-hecbench-10's are upstream LASSI's
# instead, so the nine apps both suites hold run with other arguments here.
# passfail: the languages whose sources print PASS as a whole word, the token the passfail oracle reads (bible
# Oracles); the others are scored by the masked stdout alone.
items:
  all-pairs-distance:
    split: eval
    run_args: ["10000"]
    passfail: [omp, cuda, hip]
    languages:
      omp:
        dir: src/all-pairs-distance-omp
        files: [main.cpp]
