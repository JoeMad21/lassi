# bale-v0-tt (bible Benchmark Suites; the owner's directions of 2026-10-29: "I want at least the majority of the BALE
# benchmark and I want C++/openMP to Tenstorrent. I do not care about C++ to openMP and back"; all eight of bale's
# classic apps): the bale apps as C++ -> TT and OpenMP -> TT items, where the model writes the whole TT-Metalium
# program, the host program and the kernel it launches (the ttkh language of tt-pairs-v0-kh). Every item is unassigned
# until the owner assigns it (training, prompt tuning, and harvest refused; Agent Rule 5); fetch only, no bale text
# tracked. bale is github.com/jdevinney/bale (its README.md:15: "bale is not a collection of benchmarks") under the
# Institute for Defense Analyses' BSD-3-Clause-style license with a DFARS clause (its LICENSE; Copyright (c) 2020,
# Institute for Defense Analyses).
# The programs are bale-v0's, written here and tracked under assets/bench/bale-v0/<item>/: cpp/<item>.cpp, a serial C++
# program that follows the generic serial kernel of bale's src/other_serial/C/<item>.c, and omp/<item>.cpp, the same
# computation with OpenMP and the same outputs. Each language names bale's serial C file of its app as the support file
# upstream/<file>.c, by its path at the pin and its sha256, which tools/fetch_bench.py fetches into $LASSI_SCRATCH/bench
# and checks; no prompt shows it. bale-v0's deviations from bale hold here too (inputs drawn by generate_inputs from
# each item's seed, outputs as lassi_io files); each item below states its own.
# What differs from bale-v0: the held-out inputs are smaller, so that a whole TT candidate runs on ttsim, a slow
# simulator, and every array of an item fits at once in the L1 memory of one Tensix core (1499136 bytes, worker_l1_size
# of tt-metal's tt_metal/soc_descriptors/wormhole_b0_80_arch.yaml at the pin, part of it reserved by tt-metal); the
# seeds are new (4201 to 4208), so bale-v0's held-out inputs are not these; and each item has a ttkh language: the
# host program <item>.cpp and one kernel, kernels/<item>_kernel.cpp, which the host program launches by that path (the one-kernel
# layout is this suite's choice: these apps are irregular integer work, which a data movement core does as ordinary C++
# on L1, with no tile math). `reference: cpp` makes the item's serial C++ program the ttkh reference, built by the
# pinned host g++ and run on the host CPU, so the oracle compares a TT candidate's outputs with the serial program's
# exactly; the ttkh support holds lassi_io.h alone. With fixes.baseline_both on, an omp -> ttkh run also checks that
# the OpenMP program agrees exactly with the serial one before any model is asked.
# Per item: split unassigned; seed, inputs (at most 16384 elements each), and outputs give the program's arguments,
# the input files in input order and then the output files (lassi.bench.registry program_args); tolerance is exact
# (max_abs 0), and every output is i64. Fetch with `uv run tools/fetch_bench.py assets/bench/bale-v0-tt.yaml`.
suite: bale-v0-tt
repo: https://github.com/jdevinney/bale.git
# bale-v0's commit: master at the bale spike's reading, committed 2022-06-26 (plans/spikes/bale.md).
commit: 1b8f673b56645b2bd74a8af6213462bbc9d559fe
