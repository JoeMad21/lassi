            sha256: 15b9b6f921ecb67d2edeebf2ba3d6fb83446d9023cce6d8cd5dc2d93f6132250
      ttkh:
        dir: assets/bench/tt-pairs-v0/matmul_multi_core/ttkh  # never read: the reference is the tt program
        tracked: true
