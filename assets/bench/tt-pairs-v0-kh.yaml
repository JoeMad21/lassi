            tracked: assets/harness/c/lassi_io.h
            sha256: de51ccc4c6d9d2369e69080fe7de66244bea7d5dca1f3acccdd33845a4037de5
  matmul_single_core:
    split: unassigned
    seed: 4
    # c = a b at upstream's 640 x 640 x 640, uniform [0, 1); the TT program refuses a b that is not square, since
