        tracked: true
        files: [matmul_multi_core.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-pairs-v0/matmul_multi_core/tt
        tracked: true
        files: [matmul_multi_core.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          kernels/dataflow/reader_mm_output_tiles_partitioned.cpp:
