            sha256: cc6f2fba6f6f40ce7525e5d29559b5ead62e5f980d67dd7ac925a86a70877ce0
          lassi_io.h:
            tracked: assets/harness/c/lassi_io.h
            sha256: de51ccc4c6d9d2369e69080fe7de66244bea7d5dca1f3acccdd33845a4037de5
  eltwise_sfpu:
    split: unassigned
    seed: 3
    # exp elementwise over 64 tiles of uniform [0, 1), as upstream draws them; the results lie in [1, e)
