  loopback:
    split: unassigned
    seed: 1
    # a DRAM-to-DRAM copy of upstream's 50 tiles as one flat vector, uniform [0, 100) as upstream draws them
    inputs:
      - {name: input, dtype: bf16, shape: [51200], dist: uniform, lo: 0.0, hi: 100.0}
    outputs: [output]  # bf16 on both sides
    # exact equality: upstream requires every element of the copy to equal the input
    tolerance: {metric: max_abs, threshold: 0}
    unpack_to_dest: >-
      not taken: the example has one data-movement kernel and no compute kernel, so nothing unpacks to dest; the
      host program written here likewise creates one data-movement kernel and no circular buffer, and names no
      compute config, fp32_dest_acc_en, or unpack_to_dest_mode (P4.9 reading; tests/bench/test_tt_pairs.py checks it)
    languages:
