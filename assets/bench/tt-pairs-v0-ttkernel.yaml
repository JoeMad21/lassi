# The cpp -> ttkernel suite (task P17.36): the five tt-pairs-v0 items, unchanged (the same splits, held-out inputs,
# seeds, outputs, tolerances, notes, and cpp and tt languages; tests/bench/test_ttkernel_suite.py checks it), plus a
# ttkernel language. tt-pairs-v0 is a development set (OQ-083 (b)). A ttkernel translation is one ttkernel MLIR module
# per kernel the item's tracked TT host program launches, at that kernel's path with .mlir in place of .cpp; the
# ttkernel-ttmetal toolchain lowers each module to kernel C++ at the kernel's path with the pinned tt-mlir and builds
# the host program, a support file the model never writes (bible Level Rules). The ttkernel support holds the tracked
# host program and lassi_io.h with their sha256 and no kernel: the upstream kernel C++ would be the answer (Agent Rule
# 5). `reference: tt` makes the item's tt program (the host program with the upstream kernels, fetched by
# tools/fetch_bench.py) the ttkernel reference the baseline builds and runs, so the oracle reads a ttkernel candidate
# exactly as it reads a cpp -> tt candidate on tt-pairs-v0. Fetch with
# `uv run tools/fetch_bench.py assets/bench/tt-pairs-v0-ttkernel.yaml`.
suite: tt-pairs-v0-ttkernel
repo: https://github.com/tenstorrent/tt-metal.git
# tt-metal at P4.2's install commit, the joint pin (toolchains/tt-metal.pin; bible Toolchain Pins), as tt-pairs-v0.yaml
# pins it; load_suite checks that the pin's COMMIT and URL are this commit and repo. Every item comment below is
# tt-pairs-v0.yaml's, copied with its item.
commit: 5280a9cfb00998fd49667a29523d03aee905c129
pin: tt-metal
items:
  eltwise_binary:
    split: unassigned
    seed: 2
    # a + b elementwise over 64 tiles. Upstream fills b with the constant -1.0; b is drawn here instead, so a
    # candidate that ignores b cannot pass. The sums stay in (-1, 1).
    inputs:
      - {name: a, dtype: bf16, shape: [65536], dist: uniform, lo: 0.0, hi: 1.0}
      - {name: b, dtype: bf16, shape: [65536], dist: uniform, lo: -1.0, hi: 0.0}
    outputs: [c]  # f32 on both sides: the TT program widens the device's bf16 result exactly
    # absolute 1e-2: the upstream check fails an element whose result differs from the f32 sum by more than 1e-2
    tolerance: {metric: max_abs, threshold: 0.01}
    unpack_to_dest: >-
      not taken: the upstream example sets no fp32_dest_acc_en and no unpack_to_dest_mode and keeps every circular
      buffer Float16_b (P4.9 reading; its ttsim run printed no finding), and the host program written here does the
      same: its one ComputeConfig sets only math_fidelity HiFi4, and its three circular buffers (c_0, c_1, c_16) are
      Float16_b (tests/bench/test_tt_pairs.py checks it)
    languages:
      cpp:
        dir: assets/bench/tt-pairs-v0/eltwise_binary/cpp
        tracked: true
        files: [eltwise_binary.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-pairs-v0/eltwise_binary/tt
        tracked: true
        files: [eltwise_binary.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          eltwise_binary/kernels/dataflow/read_tiles.cpp:
            upstream: tt_metal/programming_examples/eltwise_binary/kernels/dataflow/read_tiles.cpp
            sha256: 4f667427aa88e9c85bed20109eda7c0ec71e7f2171f56ac98b51f22f16bb2c6e
          eltwise_binary/kernels/dataflow/write_tile.cpp:
            upstream: tt_metal/programming_examples/eltwise_binary/kernels/dataflow/write_tile.cpp
            sha256: 9c7fa7775ef350eada5e60a2db20d51af4e8244398ebd886585bc6b7c9b86b95
          eltwise_binary/kernels/compute/tiles_add.cpp:
            upstream: tt_metal/programming_examples/eltwise_binary/kernels/compute/tiles_add.cpp
            sha256: f3a596d336425cfaf938b10574340c8a5b870bdfdd640484970597b07f9103b3
      ttkernel:
        dir: assets/bench/tt-pairs-v0/eltwise_binary/ttkernel  # never read: the reference is the tt program
        tracked: true
        files:
          - eltwise_binary/kernels/dataflow/read_tiles.mlir
          - eltwise_binary/kernels/dataflow/write_tile.mlir
          - eltwise_binary/kernels/compute/tiles_add.mlir
        reference: tt
        support:
          eltwise_binary.cpp:
