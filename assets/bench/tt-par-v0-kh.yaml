  col_max:
    split: eval
    seed: 22
    # m[j] = the maximum over i of a[i, j] for a bf16 a of [256, 4096], written here (OQ-129). The unit of work is a
    # tile column (32 columns of a, 8 tiles): 128 units, more than either grid below has cores. The input is uniform
    # [-1, 0.0625): about 6 percent of the elements are non-negative (from 1 to 30 in each column at this seed), so
    # every column's maximum is a small positive value (from 0.0215 to 0.0623 here), where bf16 steps by at most
    # 2^-12, and the maximum is a single element in all but 137 of the 4096 columns. Computed from this seed's
    # inputs: a candidate that skips one tile row of a changes from 483 to 520 column maxima, one that skips a
    # single row of a changes 12 or more, and one that takes the largest magnitude instead changes all 4096 (the
    # most negative elements lie near -1). No column is all negative, so the result does not depend on how the
    # maximum reduce reads a Dst row the packer has cleared (as minus infinity, by tt-isa-documentation's GMPOOL;
    # unconfirmed here), and a candidate that starts its running maximum at 0 is not caught.
    # The reference splits the 128 tile columns over the device's compute grid with split_work_to_cores, one run of
    # consecutive tile columns per core. Cores it uses, PROJECTED (arithmetic from that split, no run): 56 on card 0's
    # 8 x 7 grid (16 cores of 3 tile columns and 40 of 2) and 72 on an 8 x 9 grid (56 cores of 2 tile columns and 16
    # of 1); P17.70 counts the cores under ttsim.
    inputs:
      - {name: a, dtype: bf16, shape: [256, 4096], dist: uniform, lo: -1.0, hi: 0.0625}
    outputs: [m]  # bf16 [4096] on both sides: each maximum is one of a's elements, moved as its bit pattern
    # exact equality, from the arithmetic. The maximum of bf16 values is one of them, and the pinned reduce keeps it
    # unchanged: under REDUCE_COL MAX, tt-llk (the pin's submodule f9909668) issues one GMPOOL per face with no
    # fidelity phases, and GMPOOL (tt-isa-documentation) scales each element only by the power of two in the exponent
    # of its scaler datum before comparing; the scaler is 1.0, so nothing is scaled. bf16 elements reach SrcA and the
    # 16-bit Dst as they are (no element of the input is a denormal, which the unit would flush to zero), and the
    # packer writes Dst to the Float16_b output pages unchanged, so every m[j] equals the C++ program's bit for bit.
    tolerance: {metric: max_abs, threshold: 0}
    # Analytic work (task P17.42): 255 comparisons per column, counted under ops with no FLOP figure, since a maximum
    # does no rounding arithmetic; the bf16 input read and the bf16 maxima written once on the device (2 bytes each);
    # a property of the item, never a measurement.
    work:
      flop: null
      ops: {max: 1044480}
      bytes: 2105344
      basis: '4096 columns x 255 comparisons; (1048576 + 4096) bf16 elements x 2 bytes'
    unpack_to_dest: >-
      not taken: the host program written here sets no fp32_dest_acc_en and no unpack_to_dest_mode (its one
      ComputeConfig sets only math_fidelity HiFi4, every other field at its default, compile_args empty), and its
      three circular buffers (c_0, c_1, c_16) are Float16_b, so the reduce works in a 16-bit Dst and nothing is
      unpacked as Float32 (read from the program; no run yet)
    languages:
      cpp:
        dir: assets/bench/tt-par-v0/col_max/cpp
        tracked: true
        files: [col_max.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-par-v0/col_max/tt
        tracked: true
        files: [col_max.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          # The kernels are written here and tracked, each at the path the host program launches it by.
          kernels/dataflow/read_tile_columns.cpp: {tracked: assets/bench/tt-par-v0/col_max/tt/kernels/dataflow/read_tile_columns.cpp}
          kernels/compute/max_tile_columns.cpp: {tracked: assets/bench/tt-par-v0/col_max/tt/kernels/compute/max_tile_columns.cpp}
          kernels/dataflow/write_column_maxima.cpp: {tracked: assets/bench/tt-par-v0/col_max/tt/kernels/dataflow/write_column_maxima.cpp}
      ttkh:
        dir: assets/bench/tt-par-v0/col_max/ttkh  # never read: the reference is the tt program
        tracked: true
        files:
