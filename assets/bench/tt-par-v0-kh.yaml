  row_softmax:
    split: eval
    seed: 25
    # y[i, j] = exp(x[i, j] - max_k x[i, k]) / sum_k exp(x[i, k] - max_k x[i, k]) for a bf16 x of [4096, 256]
    # (1,048,576 elements, the 2**20 cap), a computation written here (OQ-129). x is uniform [64, 128) so that the
    # subtraction of the maximum is required: exp overflows float32 and bf16 above about 88.72, and about 61% of the
    # elements lie above that, so a program that drops the subtraction gets an infinity on the host (float32 exp) or a
    # NaN on the device (the pinned non-approximate exp clamps its exponent field at 255, which reads as NaN) in every
    # row, and binary_io fails any unmatched NaN or infinity; the chance that a row of 256 has no element above 88.72
    # is 0.386**256, about 1e-106. With the subtraction every exponent lies in [-64, 0]: the bf16 inputs are multiples
    # of 0.5 there, each within a factor of 2 of its row's maximum, so x - max is exact in bf16 and exp never
    # underflows. Uniform [-8, 8) would not test the subtraction: exp(8) is far from overflow, and on this seed a
    # float32 program without it lands within 0.00025 of the reference (PROJECTED: a model of the arithmetic, no run). Since
    # softmax does not change under a per-row shift, a program that subtracts some other value of the row (its first
    # element, say) also passes here; the item checks the outputs, not which shift was used. On this seed the row sums
    # of exp(x - max) lie in [1.68, 15.8] and the largest output is 0.594.
    # Work unit: one tile row (32 rows, 8 tiles); the reference splits the 128 tile rows over the compute grid with
    # split_work_to_cores. Reference cores, PROJECTED (arithmetic from that split, no run): 56 on card 0's 8 x 7 grid
    # (16 cores of 3 tile rows and 40 of 2) and 72 on an 8 x 9 grid (56 cores of 2 and 16 of 1); P17.70 counts the
    # cores under ttsim. Each working core's circular buffers take 35 tiles, 71,680 bytes (70 KiB) of L1: c_0 two tile
    # rows of input (16 tiles), c_3 the tile row of exp(x - max) (8), c_16 the output tile row (8), and one tile each
    # for the reduce scaler (c_1), the row maxima (c_2), and the reciprocal sums (c_4).
    inputs:
      - {name: x, dtype: bf16, shape: [4096, 256], dist: uniform, lo: 64.0, hi: 128.0}
    outputs: [y]  # bf16 [4096, 256] on both sides
    # absolute 0.03 on outputs in [0, 1], set from the arithmetic. The C++ program rounds float32 values once to bf16
    # (half an ulp: at most 0.002 at this seed's largest output). The device rounds at each step with fp32_dest_acc_en
    # off: exp (the pinned exp_21f, a polynomial within about 0.2%, rounded to bf16), the row sum (each row's 16 face
    # partial sums, 2 faces x 8 tiles, accumulated in 16-bit dest), the reciprocal (Newton steps from a fixed guess,
    # rounded to bf16), and the product (rounded to bf16). A bf16 model of those steps on this seed's 4096 rows
    # (PROJECTED: arithmetic, no device run) gives a largest difference of 0.0059 with round-to-nearest at each
    # accumulation and 0.0195 with truncation at each of 32 (every face sum split in two), the worst case modeled;
    # 0.03 sits above both. A max_abs bound, not pcc, since a per-row scale
    # error keeps pcc high (a sum over 7 of the 8 tiles still has pcc 0.986, PROJECTED). Wrong programs miss by far
    # more in the same model (PROJECTED): no normalization or a one-hot answer by 0.94, a sum over 7 of the 8 tiles by 0.86, a maximum over
    # each column of the tile row instead of each row by 0.47; one without the subtraction gets NaN or infinity.
    tolerance: {metric: max_abs, threshold: 0.03}
    # Analytic work (task P17.42), per row of 256: 255 comparisons for the maximum, 256 subtractions, 256 exp, 255
    # additions for the sum, one reciprocal, and 256 multiplies (the TT reference's reciprocal-then-multiply form). flop counts
    # the comparisons, subtractions, additions, and multiplies (1022 per row); exp and the reciprocal go under ops
    # only. bytes: the bf16 input read and the bf16 output written once (2 bytes each), the fewest the device must
    # move. The same for every candidate; never a measurement.
    work:
      flop: 4186112
      ops: {max: 1044480, sub: 1048576, exp: 1048576, add: 1044480, recip: 4096, mul: 1048576}
      bytes: 4194304
      basis: >-
        4096 rows of 256, per row 255 max comparisons, 256 subtractions, 256 exp, 255 adds, 1 reciprocal, and 256
        multiplies; flop = 4096 x 1022 (comparisons, subtractions, adds, multiplies); (1048576 + 1048576) bf16
        elements x 2 bytes
    unpack_to_dest: >-
      not taken: the host program written here sets no fp32_dest_acc_en and no unpack_to_dest_mode: its one
      ComputeConfig sets only math_fidelity HiFi4, math_approx_mode false, and compile_args, and its six circular
      buffers (c_0, c_1, c_2, c_3, c_4, c_16) are all Float16_b; the compute kernel written here unpacks only to the
      source registers (the row reduces of c_0 and c_3 with the c_1 scaler, and the column-broadcast subtract and
      multiply) and calls no copy or unpack-to-dest path (read from the code; no ttsim run of it yet)
    languages:
      cpp:
        dir: assets/bench/tt-par-v0/row_softmax/cpp
        tracked: true
        files: [row_softmax.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-par-v0/row_softmax/tt
        tracked: true
        files: [row_softmax.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          # Written here and tracked, each at the path the host program launches it from.
          kernels/dataflow/row_softmax_reader.cpp:
            tracked: assets/bench/tt-par-v0/row_softmax/tt/kernels/dataflow/row_softmax_reader.cpp
          kernels/compute/row_softmax.cpp:
            tracked: assets/bench/tt-par-v0/row_softmax/tt/kernels/compute/row_softmax.cpp
          kernels/dataflow/row_softmax_writer.cpp:
            tracked: assets/bench/tt-par-v0/row_softmax/tt/kernels/dataflow/row_softmax_writer.cpp
      ttkh:
        dir: assets/bench/tt-par-v0/row_softmax/ttkh  # never read: the reference is the tt program
        tracked: true
        files:
          - row_softmax.cpp
          - kernels/dataflow/row_softmax_reader.cpp
          - kernels/compute/row_softmax.cpp
          - kernels/dataflow/row_softmax_writer.cpp
        reference: tt
        support:
          lassi_io.h:
