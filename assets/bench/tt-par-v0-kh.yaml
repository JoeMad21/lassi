  transpose_2d:
    split: eval
    seed: 23
    # B = A^T for a bf16 A of [1024, 1024], a computation the owner chose for the held-out items (OQ-129), with both
    # programs and the kernels written here: an eval item, never given to training, prompt tuning, or corpus harvest
    # (Agent Rule 5). 1024 x 1024 is 2**20 elements, the input cap, and gives B 1024 tiles, more than the cores of any
    # grid here. A is drawn uniform [-4, 4) over its 2**20 elements, so it is far from symmetric and its tiles are far
    # from their own transposes: a program that copies A unchanged, moves whole tiles to their mirrored places without
    # turning each one, or turns each tile where it stands without moving it misses most elements by up to 8. The
    # draw's step is 2**-21, so no value is subnormal (the device reads a subnormal source value as zero), and the
    # draw gives no -0.
    # The reference splits B's 1024 tiles over the device's compute grid with split_work_to_cores, one run of
    # consecutive tiles per core. Cores it uses, PROJECTED (arithmetic from that split at the pin, no run): 56 on card
    # 0's 8 x 7 grid (16 cores of 19 tiles and 40 of 18) and 72 on an 8 x 9 grid (16 cores of 15 tiles and 56 of 14);
    # P17.70 counts the cores under ttsim.
    inputs:
      - {name: a, dtype: bf16, shape: [1024, 1024], dist: uniform, lo: -4.0, hi: 4.0}
    outputs: [b]  # bf16 [1024, 1024], row-major on both sides
    # exact equality: a transpose moves bit patterns and computes nothing. On the device each bf16 value goes from its
    # Float16_b tile into source register A unchanged (bf16 sits in the register's 19-bit format with its three low
    # mantissa bits zero), the unpacker transposing the faces and each face; into the 16-bit destination register by a
    # move that passes bf16 through unchanged (transpose_wh.h at the pin: llk_unpack_A, then
    # llk_math_eltwise_unary_datacopy A2D, for any input that is not Int32); and out through the packer to a
    # Float16_b tile. The C++ program copies the same bit patterns.
    tolerance: {metric: max_abs, threshold: 0}
    # Analytic work (task P17.42): a transpose, no floating-point arithmetic, so no FLOP figure; the bf16 input read and
    # the bf16 output written once (2 bytes each); never a measurement.
    work:
      flop: null
      ops: {}
      bytes: 4194304
      basis: 'a transpose, no arithmetic; (1048576 + 1048576) bf16 elements x 2 bytes'
    unpack_to_dest: >-
      not taken: the host program written here creates one compute kernel, whose one ComputeConfig sets only
      math_fidelity HiFi4 and empty compile_args, so fp32_dest_acc_en stays off and unpack_to_dest_mode stays empty,
      and its two circular buffers (c_0, c_16) are Float16_b; the compute kernel written here calls transpose_wh_init
      and transpose_wh_tile, which take their UnpackToDestEn path only for an Int32 input (transpose_wh.h:37-42 and
      :103-108 at the pin), never for c_0's Float16_b (read at the pin; no run yet)
