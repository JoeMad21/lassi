            sha256: de51ccc4c6d9d2369e69080fe7de66244bea7d5dca1f3acccdd33845a4037de5
  col_scale:
    split: eval
    seed: 24
    # C[i, j] = A[i, j] * s[j] for a bf16 A of [1024, 1024] and a bf16 row vector s of [1024], a computation the owner
    # chose for the held-out items (OQ-129), with both programs and the kernels written here: an eval item, never given
    # to training, prompt tuning, or corpus harvest (Agent Rule 5). A is 2**20 elements, the input cap, and C has 1024
    # tiles, more than the cores of any grid here. A is drawn uniform [-1, 1) and s uniform [-2, 2), each from its own
    # stream: a program that ignores s (C = A) misses by |A| |s - 1|, up to 3; one that broadcasts along the wrong axis
    # (C[i, j] = A[i, j] * s[i]) by |A| |s[i] - s[j]|, up to 4; one that multiplies by the scale tile elementwise, or
    # broadcasts its first column, zeroes rows or columns it should scale; and one that takes the wrong tile of s
    # scales a tile column by another column's values. Every such miss is far past the tolerance. The draws' steps
    # (2**-23 and 2**-22) keep every nonzero value and every nonzero product a normal bf16, so the device's flushing of
    # subnormals changes nothing.
    # The reference splits C's 1024 tiles over the device's compute grid with split_work_to_cores, one run of
    # consecutive tiles per core; the host lays s out as one scale tile per tile column (s in the tile's first row,
    # zeros below) and computes no product. Cores it uses, PROJECTED (arithmetic from that split at the pin, no run):
    # 56 on card 0's 8 x 7 grid (16 cores of 19 tiles and 40 of 18) and 72 on an 8 x 9 grid (16 cores of 15 tiles and
    # 56 of 14); P17.70 counts the cores under ttsim.
    inputs:
      - {name: a, dtype: bf16, shape: [1024, 1024], dist: uniform, lo: -1.0, hi: 1.0}
      - {name: s, dtype: bf16, shape: [1024], dist: uniform, lo: -2.0, hi: 2.0}
    # bf16 [1024, 1024], row-major on both sides: the device packs its products as Float16_b and the TT program writes
    # them unconverted; the C++ program rounds the exact f32 product to bf16, to nearest with ties to even, so the two
    # are compared in the one format the device can produce, with no host conversion of a device value.
    outputs: [c]
    # absolute 2**-6 = 0.015625, two bf16 units in the last place below 2, from the device's arithmetic (PROJECTED:
    # reasoning and a model of it, no run). The compute kernel multiplies with math fidelity HiFi4: the matrix unit's multiplier takes 5 bits of the
    # A operand and 7 of the s operand, so a bf16 product needs all four fidelity phases (tt-isa-documentation
    # WormholeB0 SrcASrcB.md, "Fidelity phases"; the pinned LLK's llk_math_eltwise_binary.h issues one ELWMUL per phase,
    # tt_llk f990966), and each phase adds its partial product into the 16-bit bf16 destination register with one
    # rounding to nearest, ties away from zero (MatrixUnitArithmetic.md, tt-isa-documentation f1b8bbe). Running that
    # model over every pair of bf16 mantissas and both sign relations, the device's result is within 2 bf16 units in
    # the last place of the exact product's binade of the round-to-nearest-even product the C++ program writes (65,534
    # of the 65,536 cases within 1); the same holds when the destination's stale low bit is set. Every |C| is below 2
    # except (-1)(-2) = 2, which both sides give exactly, so two units of the [1, 2) binade, 2 x 2**-7, bound every
    # element's difference. A product truncated to bf16 once, as a simpler simulator might form it, stays within 1 unit.
    tolerance: {metric: max_abs, threshold: 0.015625}
    # Analytic work (task P17.42): one multiply per element of C; A and s read and C written once on the device in bf16
    # (2 bytes each); never a measurement. The reference rereads a scale tile per tile of C, which this count, a
    # property of the item, leaves out.
    work:
      flop: 1048576
      ops: {mul: 1048576}
      bytes: 4196352
      basis: '1048576 multiplies; (1048576 + 1024 + 1048576) bf16 elements x 2 bytes'
    unpack_to_dest: >-
      not taken: the host program written here creates one compute kernel, whose one ComputeConfig sets only
      math_fidelity HiFi4 and empty compile_args, so fp32_dest_acc_en stays off and unpack_to_dest_mode stays empty,
      and its three circular buffers (c_0, c_1, c_16) are Float16_b; the compute kernel written here calls init_bcast
      for ELWMUL with a row broadcast and mul_tiles_bcast_rows, whose unpack of two Float16_b operands into the two
      source registers names no unpack-to-dest mode (bcast.h:174-183 and :239-257 at the pin; read at the pin, no run
      yet)
    languages:
      cpp:
        dir: assets/bench/tt-par-v0/col_scale/cpp
        tracked: true
        files: [col_scale.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-par-v0/col_scale/tt
        tracked: true
        files: [col_scale.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          # The kernels, written here and tracked, at the paths the host program launches them from.
          kernels/dataflow/read_tile_and_scale.cpp: {tracked: assets/bench/tt-par-v0/col_scale/tt/kernels/dataflow/read_tile_and_scale.cpp}
          kernels/compute/scale_columns.cpp: {tracked: assets/bench/tt-par-v0/col_scale/tt/kernels/compute/scale_columns.cpp}
          kernels/dataflow/write_tiles.cpp: {tracked: assets/bench/tt-par-v0/col_scale/tt/kernels/dataflow/write_tiles.cpp}
      ttkh:
        dir: assets/bench/tt-par-v0/col_scale/ttkh  # never read: the reference is the tt program
        tracked: true
        files:
          - col_scale.cpp
          - kernels/dataflow/read_tile_and_scale.cpp
