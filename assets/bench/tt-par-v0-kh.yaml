# The C++ -> TT suite of tt-par-v0's items in which the model writes the whole TT-Metalium program (task P17.69;
# OQ-129, "Both variants"): tt-par-v0's items unchanged (the same splits, held-out inputs, seeds, outputs,
# tolerances, work, notes, and cpp and tt languages; tests/bench/test_tt_par_kh.py checks it), plus a ttkh language,
# as tt-pairs-v0-kh is to tt-pairs-v0. A ttkh translation is the host program and every device kernel it launches: its
# files are the item's tracked TT host program's name, then each kernel at the path that host program launches it,
# so ttmetal-host compiles the host program and writes each kernel uncompiled at its path for the kernel JIT (bible
# Harness Contract). The ttkh support holds lassi_io.h alone, with its sha256, and no kernel: the reference's kernels
# and host program would be the answer (Agent Rule 5). `reference: tt` makes the item's tt program the ttkh
# reference the baseline builds and runs on ttsim. The development items are dev and the held-out items eval, as in
# tt-par-v0 (OQ-129). No reference has been built or run yet (task P17.76). Fetch with
# `uv run tools/fetch_bench.py assets/bench/tt-par-v0-kh.yaml`.
suite: tt-par-v0-kh
repo: https://github.com/tenstorrent/tt-metal.git
# tt-metal at P4.2's install commit, the joint pin (toolchains/tt-metal.pin; bible Toolchain Pins), as tt-par-v0.yaml
# pins it; load_suite checks that the pin's COMMIT and URL are this commit and repo. Every item comment below is
# tt-par-v0.yaml's, copied with its item.
commit: 5280a9cfb00998fd49667a29523d03aee905c129
pin: tt-metal
items:
  vecadd_multi_core:
    split: dev
    seed: 11
    # c = a + b elementwise at upstream's own size, 640 tiles (655,360 elements per vector), each input uniform
    # [0, 10) as upstream draws them; the sums lie in [0, 20). a and b come from independent streams over the whole
    # range, so a candidate that ignores either input, or adds a tile of one to the wrong tile of the other, misses
    # by up to 10, far past the tolerance. The vectors stay flat (rank 1): the TT program never tilizes them, as
    # upstream does not, since an elementwise add does not depend on where an element sits inside a tile.
    # The reference splits the 640 tiles over the device's compute grid with split_work_to_cores (row-major), one
    # run of consecutive tiles per core, as upstream does. Cores it uses, PROJECTED (arithmetic from that split, no
    # run): 56 on card 0's 8 x 7 grid (24 cores of 12 tiles and 32 of 11) and 72 on an 8 x 9 grid (64 cores of 9
    # tiles and 8 of 8); P17.70 counts the cores under ttsim.
    inputs:
      - {name: a, dtype: bf16, shape: [655360], dist: uniform, lo: 0.0, hi: 10.0}
      - {name: b, dtype: bf16, shape: [655360], dist: uniform, lo: 0.0, hi: 10.0}
    outputs: [c]  # f32 on both sides: the TT program widens the device's bf16 result exactly
    # absolute 0.3, the upstream check (vecadd_multi_core.cpp:283-284 at the pin; plans/spikes/tt-par-upstream.md): an
    # element fails when the device's sum differs from the f32 sum of the two bf16 inputs by more than 0.3, and the
    # C++ program writes that f32 sum
    tolerance: {metric: max_abs, threshold: 0.3}
    # Analytic work (task P17.42): one add per element, the two bf16 inputs read and the bf16 sum written once on the
    # device (2 bytes each); a property of the item, never a measurement.
    work:
      flop: 655360
      ops: {add: 655360}
      bytes: 3932160
      basis: '655360 adds; (2 x 655360 + 655360) bf16 elements x 2 bytes'
    unpack_to_dest: >-
      not taken: the upstream example sets no fp32_dest_acc_en and no unpack_to_dest_mode and keeps every circular
      buffer Float16_b (plans/spikes/tt-par-upstream.md, read at the pin; no run yet), and the host program written
      here does the same: its one ComputeConfig sets only math_fidelity HiFi4, math_approx_mode false, compile_args,
      and named_compile_args, and its three circular buffers (c_0, c_1, c_2) are Float16_b
    languages:
      cpp:
        dir: assets/bench/tt-par-v0/vecadd_multi_core/cpp
        tracked: true
        files: [vecadd_multi_core.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-par-v0/vecadd_multi_core/tt
        tracked: true
        files: [vecadd_multi_core.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          # Each sha256 is of the file at the pin as plans/spikes/tt-par-upstream.md fetched it, its git blob id
          # and size checked against the pinned tree. The compute kernel calls the deprecated release_dst() after
          # tile_regs_release() on every tile, which repeats the math and pack "dest section done" steps; whether
          # that is harmless on ttsim and the cards is unknown until the reference runs (the spike, item 4).
          vecadd_multi_core/kernels/interleaved_tile_read_multi_core.cpp:
            upstream: tt_metal/programming_examples/vecadd_multi_core/kernels/interleaved_tile_read_multi_core.cpp
            sha256: c044be02a23eaf2447e77ff6b37d0023355b6a2a4bed5a2686f24dd64780970f
          vecadd_multi_core/kernels/tile_write_multi_core.cpp:
            upstream: tt_metal/programming_examples/vecadd_multi_core/kernels/tile_write_multi_core.cpp
            sha256: fd273d6022c361740530a2bfbc34664a39676ccd0c04306f484b266fb5a3fc4b
          vecadd_multi_core/kernels/add_multi_core.cpp:
            upstream: tt_metal/programming_examples/vecadd_multi_core/kernels/add_multi_core.cpp
            sha256: 0d0c8fb1301dc5e0cc06349d43c9bf0ef1496166b79a6b13e9db99c23599260d
      ttkh:
        dir: assets/bench/tt-par-v0/vecadd_multi_core/ttkh  # never read: the reference is the tt program
        tracked: true
        files:
          - vecadd_multi_core.cpp
          - vecadd_multi_core/kernels/interleaved_tile_read_multi_core.cpp
          - vecadd_multi_core/kernels/tile_write_multi_core.cpp
          - vecadd_multi_core/kernels/add_multi_core.cpp
        reference: tt
        support:
          lassi_io.h:
            tracked: assets/harness/c/lassi_io.h
            sha256: de51ccc4c6d9d2369e69080fe7de66244bea7d5dca1f3acccdd33845a4037de5
  vecadd_sharding:
    split: dev
    seed: 12
    # c = a + b elementwise, raised from upstream's 16 tiles to 448 (458,752 elements per vector), so the output spans
    # more tiles than any of the grids has cores (plans/spikes/tt-par-upstream.md, Recommendation); 448 is the least
    # common multiple of 56 and 64. Each input uniform [0, 10) as upstream draws them; the sums lie in [0, 20). a and
    # b come from independent streams over the whole range, so a candidate that ignores either input, or adds a tile
    # of one to the wrong tile of the other, misses by up to 10, far past the tolerance. The vectors stay flat (rank
    # 1) and are never tilized, as upstream's are not.
    # The reference height-shards a, b, and c over the L1 of a fixed block of 56 cores, 8 wide by 7 tall ((0, 0) to
    # (7, 6)), 8 tiles per core, in place of upstream's fixed 4 cores of 4 tiles, sets each core's three circular
    # buffers to its shards' addresses, and runs upstream's one compute kernel there with no reader or writer. Cores
    # it uses, PROJECTED (arithmetic from that block, no run): 56 on card 0's 8 x 7 grid and 56 on an 8 x 9 grid,
    # the same block on both; P17.70 counts the cores under ttsim.
    inputs:
      - {name: a, dtype: bf16, shape: [458752], dist: uniform, lo: 0.0, hi: 10.0}
      - {name: b, dtype: bf16, shape: [458752], dist: uniform, lo: 0.0, hi: 10.0}
    outputs: [c]  # f32 on both sides: the TT program widens the device's bf16 result exactly
    # absolute 0.2, the upstream check (vecadd_sharding.cpp:263-264 at the pin; plans/spikes/tt-par-upstream.md): an
    # element fails when the device's sum differs from the f32 sum of the two bf16 inputs by more than 0.2, and the
    # C++ program writes that f32 sum
    tolerance: {metric: max_abs, threshold: 0.2}
    # Analytic work (task P17.42): one add per element, the two bf16 inputs written to L1 and the bf16 sum read back
    # once (2 bytes each); a property of the item, never a measurement.
    work:
      flop: 458752
      ops: {add: 458752}
      bytes: 2752512
      basis: '458752 adds; (2 x 458752 + 458752) bf16 elements x 2 bytes'
    unpack_to_dest: >-
      not taken: the upstream example sets no fp32_dest_acc_en and no unpack_to_dest_mode and keeps every circular
      buffer Float16_b (plans/spikes/tt-par-upstream.md, read at the pin; no run yet), and the host program written
      here does the same: its one ComputeConfig sets only math_fidelity HiFi4, math_approx_mode false, and
      compile_args, and its three circular buffers (c_0, c_1, c_2) are Float16_b, each at its sharded L1 buffer's
      address
    languages:
      cpp:
        dir: assets/bench/tt-par-v0/vecadd_sharding/cpp
        tracked: true
        files: [vecadd_sharding.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-par-v0/vecadd_sharding/tt
        tracked: true
        files: [vecadd_sharding.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          # The sha256 is of the file at the pin as plans/spikes/tt-par-upstream.md fetched it, its git blob id and
          # size checked against the pinned tree. The kernel never waits on its input buffers and never reserves its
          # output: it relies on each circular buffer being exactly its core's shard, already in L1.
          vecadd_sharding/kernels/add_sharding.cpp:
            upstream: tt_metal/programming_examples/vecadd_sharding/kernels/add_sharding.cpp
            sha256: 9b89bd03d6e8dedec93c8a778f9aa204f56fa3f8d639f350f32fd41ec316b2fd
      ttkh:
        dir: assets/bench/tt-par-v0/vecadd_sharding/ttkh  # never read: the reference is the tt program
        tracked: true
        files:
          - vecadd_sharding.cpp
          - vecadd_sharding/kernels/add_sharding.cpp
        reference: tt
        support:
          lassi_io.h:
            tracked: assets/harness/c/lassi_io.h
            sha256: de51ccc4c6d9d2369e69080fe7de66244bea7d5dca1f3acccdd33845a4037de5
  pad_multi_core:
    split: dev
    seed: 13
    # Each row of a row-major bf16 matrix padded on the right with the value 2.0, as upstream pads its [64, 32]
    # matrix to [64, 64], raised here to [512, 128] padded to [512, 256] (plans/spikes/tt-par-upstream.md,
    # pad_multi_core; OQ-129) so the 512 rows outnumber the cores of every grid. Upstream fills its source with
    # 1, 2, ..., 2048; the input is drawn here from [-1, 1) instead, so no input element equals the pad value and a
    # candidate that pads with the wrong value or misplaces a row cannot pass. 65536 input elements, far under the cap.
    inputs:
      - {name: src, dtype: bf16, shape: [512, 128], dist: uniform, lo: -1.0, hi: 1.0}
    outputs: [dst]  # bf16 [512, 256], row-major on both sides: the device moves 4-byte row-major sticks, never tiles
    # exact equality, chosen here: upstream prints the source and padded matrices and checks nothing. The output is
    # a copy of the input's bit patterns plus a constant, so every element must equal the C++ program's.
    tolerance: {metric: max_abs, threshold: 0}
    # Analytic work (task P17.42): a copy and a constant fill, no floating-point arithmetic, so no FLOP figure; the
    # bf16 input read and the bf16 padded output written once (2 bytes each); never a measurement.
    work:
      flop: null
      ops: {}
      bytes: 393216
      basis: 'a copy plus a constant fill; (65536 + 131072) bf16 elements x 2 bytes'
    unpack_to_dest: >-
      not taken: the example has two data-movement kernels and no compute kernel, so nothing unpacks to dest; the
      host program written here likewise creates two data-movement kernels and no compute kernel, names no compute
      config, fp32_dest_acc_en, or unpack_to_dest_mode, and gives its one circular buffer configuration (c_0, c_1,
      and c_2 sharing one L1 region) the format Float16_b where upstream names UInt32, a format no kernel here reads
      (plans/spikes/tt-par-upstream.md, pad_multi_core)
    # The TT reference's core count, PROJECTED (arithmetic over split_work_to_cores at the pin, no run): the 512 rows
    # go to the cores in whole rows over the whole compute grid, so card 0's 8x7 grid uses 56 cores (8 of 10 rows and
    # 48 of 9), an 8x9 grid 72 (8 of 8 rows and 64 of 7), and an 8x8 grid 64 (8 rows each).
    languages:
      cpp:
        dir: assets/bench/tt-par-v0/pad_multi_core/cpp
        tracked: true
        files: [pad_multi_core.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-par-v0/pad_multi_core/tt
        tracked: true
        files: [pad_multi_core.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          pad_multi_core/kernels/pad_reader_dims_rm_interleaved.cpp:
            upstream: tt_metal/programming_examples/pad_multi_core/kernels/pad_reader_dims_rm_interleaved.cpp
            sha256: 31ad8a0d23a9dca3eebc6da3d4b8c740c23a02e27e4ed711262318773e17482b
          pad_multi_core/kernels/pad_writer_dims_rm_interleaved.cpp:
            upstream: tt_metal/programming_examples/pad_multi_core/kernels/pad_writer_dims_rm_interleaved.cpp
            sha256: ee711f0765c06c770261681e5cd6b6cacb9cd99023945ad4c366113a5af4903b
      ttkh:
        dir: assets/bench/tt-par-v0/pad_multi_core/ttkh  # never read: the reference is the tt program
        tracked: true
        files:
          - pad_multi_core.cpp
          - pad_multi_core/kernels/pad_reader_dims_rm_interleaved.cpp
          - pad_multi_core/kernels/pad_writer_dims_rm_interleaved.cpp
        reference: tt
        support:
          lassi_io.h:
            tracked: assets/harness/c/lassi_io.h
            sha256: de51ccc4c6d9d2369e69080fe7de66244bea7d5dca1f3acccdd33845a4037de5
  matmul_multicore_reuse:
    split: dev
    seed: 14
    # c = a b at M 1568, K 256, N 1024 (49 x 8 x 32 tiles; plans/spikes/tt-par-upstream.md, Recommendation item 4;
    # OQ-129 (a)). Upstream's own size, 640 x 640 x 640, is valid but its block rule puts it on 5 cores; at this size
    # the rule gives one block per core over 56 cores. Inputs as upstream draws them, uniform [0, 1) shifted by -0.4
    # for a and -0.3 for b; a holds 401,408 elements and b 262,144, both under the 2**20 cap (c holds 1,605,632).
    inputs:
      - {name: a, dtype: bf16, shape: [1568, 256], dist: uniform, lo: -0.4, hi: 0.6}
      - {name: b, dtype: bf16, shape: [256, 1024], dist: uniform, lo: -0.3, hi: 0.7}
    outputs: [c]  # bf16 [1568, 1024] on both sides
    # PCC above 0.99 against the CPU result, the upstream check (matmul_multicore_reuse.cpp:393-395 at the pin, against
    # its golden of float32 sums rounded once to bf16); binary_io passes a PCC at or above the threshold
    tolerance: {metric: pcc, threshold: 0.99}
    # Blocks: the TT program restates upstream's block rule (get_large_matmul_params, matmul/matmul_common/bmm_op.hpp
    # at the pin) in code of its own, which gives upstream's values at this size on grids 8 wide and 7, 8, or 9 tall:
    # per_core_M 7 and per_core_N 4 tiles, out_subblock_h 7 and out_subblock_w 1, in0_block_w 2 (upstream's
    # constant), so 4 K steps and 7 x 8 = 56 blocks, block number b on core (b mod 8, b div 8): cores (0, 0) to
    # (7, 6), each with 72 tiles (144 KiB) of circular buffers. Arithmetic over the rule (a port checked against a
    # literal port of upstream's code over every tile count from 1 to 256 on eight grids), not a run.
    # Reference cores, PROJECTED (arithmetic, no run): 56 on card 0 (8 x 7 grid) and 56 on an 8 x 9 grid.
    # Analytic work (task P17.42): 2MNK FLOPs (one multiply-add per M N K), the two bf16 inputs read and the bf16
    # product written once (2 bytes each), the fewest bytes the device must move; this reference reads each block
    # row's strip of a on 8 cores and each block column's strip of b on 7, so it moves more. The same for every
    # candidate; never a measurement.
    work:
      flop: 822083584
      ops: {mac: 411041792}
      bytes: 4538368
      basis: '2MNK, M 1568, N 1024, K 256; (1568 x 256 + 256 x 1024 + 1568 x 1024) bf16 elements x 2 bytes'
    unpack_to_dest: >-
      not taken: the upstream example sets no fp32_dest_acc_en and no unpack_to_dest_mode and keeps every circular
      buffer Float16_b (plans/spikes/tt-par-upstream.md, read from the source; no ttsim run of it yet), and the host
      program written here does the same: its one ComputeConfig sets only math_fidelity HiFi4 and the twelve
      compile_args, and its circular buffers (c_0, c_1, and c_16 with c_24 in one shared config) are all Float16_b, so
      the compute kernel's reload of partial sums from c_24 (copy_tile) reads Float16_b with no unpack-to-dest mode
    languages:
      cpp:
        dir: assets/bench/tt-par-v0/matmul_multicore_reuse/cpp
        tracked: true
        files: [matmul_multicore_reuse.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-par-v0/matmul_multicore_reuse/tt
        tracked: true
        files: [matmul_multicore_reuse.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          matmul/matmul_common/kernels/dataflow/reader_bmm_tile_layout.cpp:
            upstream: tt_metal/programming_examples/matmul/matmul_common/kernels/dataflow/reader_bmm_tile_layout.cpp
            sha256: 8bc4f61e7780d664ed7825757fdfdc440f05fe50c8060cdfb809803b681267ef
          matmul/matmul_common/kernels/dataflow/writer_bmm_tile_layout.cpp:
            upstream: tt_metal/programming_examples/matmul/matmul_common/kernels/dataflow/writer_bmm_tile_layout.cpp
            sha256: e17aec12dd837bba1d91e66ec455611df745ff07c897f6172acd821329c1b600
          matmul/matmul_common/kernels/compute/bmm_large_block_zm.cpp:
            upstream: tt_metal/programming_examples/matmul/matmul_common/kernels/compute/bmm_large_block_zm.cpp
            sha256: 8c59140dbaf49e584af6fd1ea443d00be684f3a708bfb0fd8a7ff735539aec30
      ttkh:
        dir: assets/bench/tt-par-v0/matmul_multicore_reuse/ttkh  # never read: the reference is the tt program
        tracked: true
        files:
          - matmul_multicore_reuse.cpp
          - matmul/matmul_common/kernels/dataflow/reader_bmm_tile_layout.cpp
          - matmul/matmul_common/kernels/dataflow/writer_bmm_tile_layout.cpp
          - matmul/matmul_common/kernels/compute/bmm_large_block_zm.cpp
        reference: tt
        support:
          lassi_io.h:
            tracked: assets/harness/c/lassi_io.h
            sha256: de51ccc4c6d9d2369e69080fe7de66244bea7d5dca1f3acccdd33845a4037de5
  matmul_multicore_reuse_mcast:
    split: dev
    seed: 15
    # c = a b at M 1568, K 256, N 1024 (49 x 8 x 32 tiles; plans/spikes/tt-par-upstream.md, Recommendation item 5,
    # choice (a); OQ-129 (a)), the same size as matmul_multicore_reuse, so the pair differs only in the dataflow (each
    # core reading its own strips against strips multicast along rows and columns). Upstream's own size, 3584 x 3072 x
    # 768, has inputs over the 2**20 cap. Inputs as upstream draws them, uniform [0, 1) shifted by -0.4 for a and
    # -0.3 for b; a holds 401,408 elements and b 262,144 (c holds 1,605,632).
    inputs:
      - {name: a, dtype: bf16, shape: [1568, 256], dist: uniform, lo: -0.4, hi: 0.6}
      - {name: b, dtype: bf16, shape: [256, 1024], dist: uniform, lo: -0.3, hi: 0.7}
    outputs: [c]  # bf16 [1568, 1024] on both sides
    # PCC above 0.98 against the CPU result, the upstream check (matmul_multicore_reuse_mcast.cpp:516-518 at the pin,
    # against its golden of float32 sums rounded once to bf16); binary_io passes a PCC at or above the threshold
    tolerance: {metric: pcc, threshold: 0.98}
    # Blocks: the TT program restates upstream's block rule (get_large_matmul_params, matmul/matmul_common/bmm_op.hpp
    # at the pin) in code of its own, which gives upstream's values at this size on grids 8 wide and 7, 8, or 9 tall:
    # per_core_M 7 and per_core_N 4 tiles, out_subblock_h 7 and out_subblock_w 1, in0_block_w 2 (upstream's
    # constant), so 4 K steps and a rectangle of 7 block rows by 8 block columns from (0, 0), as get_core_range
    # (bmm_op.hpp) gives it: cores (0, 0) to (7, 6), each with 72 tiles (144 KiB) of circular buffers and four
    # semaphores. Core (0, 0) sends a along row 0 and b down column 0; the rest of column 0 send a to 7 cores each and
    # receive b; the rest of row 0 receive a and send b to 6 cores each; the other 42 receive both. The kernels'
    # paths are the real tail matmul/matmul_common/kernels/...: upstream's host names
    # tt_metal/programming_examples/matmul_common/kernels/..., which does not exist at the pin, and no CMake file
    # builds that host. Arithmetic over the rule (a port checked against a literal port of upstream's code), not a run.
    # Reference cores, PROJECTED (arithmetic, no run): 56 on card 0 (8 x 7 grid) and 56 on an 8 x 9 grid.
    # Analytic work (task P17.42): 2MNK FLOPs (one multiply-add per M N K), the two bf16 inputs read and the bf16
    # product written once (2 bytes each), the fewest bytes the device must move, which this reference's DRAM reads
    # match (each strip read once and multicast); the same for every candidate; never a measurement.
    work:
      flop: 822083584
      ops: {mac: 411041792}
      bytes: 4538368
      basis: '2MNK, M 1568, N 1024, K 256; (1568 x 256 + 256 x 1024 + 1568 x 1024) bf16 elements x 2 bytes'
    unpack_to_dest: >-
      not taken: the upstream example sets no fp32_dest_acc_en and no unpack_to_dest_mode and keeps every circular
      buffer Float16_b (plans/spikes/tt-par-upstream.md, read from the source; no ttsim run of it yet), and the host
      program written here does the same: its one ComputeConfig sets only math_fidelity HiFi4 and the twelve
      compile_args, and its circular buffers (c_0, c_1, and c_16 with c_24 in one shared config) are all Float16_b, so
      the compute kernel's reload of partial sums from c_24 (copy_tile) reads Float16_b with no unpack-to-dest mode
    languages:
      cpp:
        dir: assets/bench/tt-par-v0/matmul_multicore_reuse_mcast/cpp
        tracked: true
        files: [matmul_multicore_reuse_mcast.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-par-v0/matmul_multicore_reuse_mcast/tt
        tracked: true
        files: [matmul_multicore_reuse_mcast.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          matmul/matmul_common/kernels/dataflow/reader_bmm_tile_layout_in0_sender_in1_sender.cpp:
            upstream: tt_metal/programming_examples/matmul/matmul_common/kernels/dataflow/reader_bmm_tile_layout_in0_sender_in1_sender.cpp
            sha256: 31dd377003eb2bc302bd508a9603591e28838f8d6d0a0e4fc28581c0ba50cebd
          matmul/matmul_common/kernels/dataflow/reader_bmm_tile_layout_in0_sender_in1_receiver.cpp:
