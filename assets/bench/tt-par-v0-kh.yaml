  row_sum:
    split: eval
    seed: 21
    # s[i] = the sum over j of a[i, j] for a bf16 a of [4096, 256], written here (OQ-129). The unit of work is a tile
    # row (32 rows of a, 8 tiles): 128 units, more than either grid below has cores. The input is uniform [-1, 1), so
    # the row sums are centred on 0 (from -36.9 to 32.3 at this seed, standard deviation 9.2) and the running sums
    # stay small against the elements; every element is drawn independently, so a candidate that skips part of a
    # row, sums a column, or writes a row's sum to another row misses by far more than the tolerance (below).
    # The reference splits the 128 tile rows over the device's compute grid with split_work_to_cores, one run of
    # consecutive tile rows per core. Cores it uses, PROJECTED (arithmetic from that split, no run): 56 on card 0's
    # 8 x 7 grid (16 cores of 3 tile rows and 40 of 2) and 72 on an 8 x 9 grid (56 cores of 2 tile rows and 16 of 1);
    # P17.70 counts the cores under ttsim.
    inputs:
      - {name: a, dtype: bf16, shape: [4096, 256], dist: uniform, lo: -1.0, hi: 1.0}
    # f32 [4096] on both sides. The device's sums are bf16 and the TT program widens them to f32 exactly, as
    # tt-pairs-v0 eltwise_binary does; the C++ program writes each exact row sum rounded once to f32. f32 rather than
    # bf16 so that the C++ side adds no bf16 rounding of its own (the tolerance then bounds the device's error alone)
    # and a translation that keeps more precision, such as an f32 Dst or f32 output pages, is not penalized.
    outputs: [s]
    # max_abs 4.0, from the arithmetic, not from a run. The reference accumulates in a 16-bit (bf16) Dst: its
    # ComputeConfig leaves fp32_dest_acc_en off. Along one row the reduce rounds the running sum into Dst 32 times: 8
    # tiles x 2 faces x the 2 fidelity phases whose products are nonzero when the scaler is 1.0 (tt-llk's REDUCE_ROW
    # reduce at the pin's submodule f9909668 issues one GAPOOL per face and phase under HiFi4; tt-isa-documentation,
    # GAPOOL, MVMUL, and Matrix Unit arithmetic: each GAPOOL rounds into Dst once, to nearest). Each rounding is at
    # most half a bf16 ulp of the running sum, 0.125 below a magnitude of 64 (the largest running sum here is 36.9):
    # 32 x 0.125 = 4.0. Worked out row by row for this seed's inputs, with each lane's 10-bit alignment of its products
    # and terms added, the bound is at most 2.79; a bit-level model of that documented arithmetic gives an error of at
    # most 0.62 (both PROJECTED, from the inputs and the documentation, no run). The C++ program's f32 rounding adds at
    # most 2e-6. A candidate that drops one 16-column face of every row misses by up to 7.8 here, and one that drops a
    # tile column by up to 11.9; one that drops a single column of a (at most 1.0) is not caught.
    tolerance: {metric: max_abs, threshold: 4.0}
    # Analytic work (task P17.42): 255 adds per row, the bf16 input read and the bf16 sums written once on the device
    # (2 bytes each); a property of the item, never a measurement.
    work:
      flop: 1044480
      ops: {add: 1044480}
      bytes: 2105344
      basis: '4096 rows x 255 adds; (1048576 + 4096) bf16 elements x 2 bytes'
    unpack_to_dest: >-
      not taken: the host program written here sets no fp32_dest_acc_en and no unpack_to_dest_mode (its one
      ComputeConfig sets only math_fidelity HiFi4, every other field at its default, compile_args empty), and its
      three circular buffers (c_0, c_1, c_16) are Float16_b, so the reduce accumulates in a 16-bit Dst and nothing is
      unpacked as Float32 (read from the program; no run yet)
    languages:
      cpp:
        dir: assets/bench/tt-par-v0/row_sum/cpp
        tracked: true
        files: [row_sum.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
      tt:
        dir: assets/bench/tt-par-v0/row_sum/tt
        tracked: true
        files: [row_sum.cpp]
        support:
          lassi_io.h: {tracked: assets/harness/c/lassi_io.h}
          # The kernels are written here and tracked, each at the path the host program launches it by.
          kernels/dataflow/read_tile_rows.cpp: {tracked: assets/bench/tt-par-v0/row_sum/tt/kernels/dataflow/read_tile_rows.cpp}
          kernels/compute/sum_tile_rows.cpp: {tracked: assets/bench/tt-par-v0/row_sum/tt/kernels/compute/sum_tile_rows.cpp}
          kernels/dataflow/write_row_sums.cpp: {tracked: assets/bench/tt-par-v0/row_sum/tt/kernels/dataflow/write_row_sums.cpp}
      ttkh:
        dir: assets/bench/tt-par-v0/row_sum/ttkh  # never read: the reference is the tt program
        tracked: true
        files:
          - row_sum.cpp
          - kernels/dataflow/read_tile_rows.cpp
          - kernels/compute/sum_tile_rows.cpp
          - kernels/dataflow/write_row_sums.cpp
        reference: tt
        support:
