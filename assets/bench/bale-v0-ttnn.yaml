# The cpp -> ttnn and omp -> ttnn suite of bale-v0-tt's eight apps (task P17.57; route A of
# plans/spikes/scatter-gather-workarounds.md, the owner's answer to OQ-112: "Go with your plans in order, starting with
# A."), compile only for now. It is a sibling of bale-v0-tt.yaml, as tt-pairs-v0-ttir is of tt-pairs-v0: the eight
# items unchanged (the same splits, held-out inputs, seeds, outputs, tolerances, notes, and cpp and omp languages;
# tests/bench/test_bale_ttnn_suite.py checks it), every item unassigned until the owner assigns it (training, prompt
# tuning, and harvest refused; Agent Rule 5), and a ttnn language in place of ttkh. A ttnn translation is one TTIR
# MLIR module, <item>.mlir, whose public function computes the item on tensors; the ttir-ttnn-compile toolchain lowers
# it with the pinned tt-mlir (0.9.0.dev20260221, commit 5f396fd6) through --ttir-to-ttnn-backend-pipeline to TT-NN
# ops and writes a TT-NN flatbuffer. Nothing runs it yet (task P17.58 measures TT-NN on ttsim first). `reference:
# cpp` makes the item's serial C++ program the ttnn reference, as for ttkh; the ttnn dir is never read, so no
# reference module (the item's answer) exists in the repository.
#
# The device boundary, the item contract. The device has no 64-bit integer type and the TT-NN pipeline narrows i64 to
# 32 bits (spike, section 3), and a TTIR function's results have static shapes, so each item's ttnn language carries
# one support file, boundary.yaml (assets/bench/bale-v0-ttnn/<item>/, pinned by sha256), which fixes the module's
# public function and how the host converts the item's i64 lassi_io files:
# - static: an input the module does not take, a scalar whose manifest range holds one value, `value`; the host
#   refuses an input file that holds another.
# - args: the function's arguments in order, each {name, input, dtype, shape, convert}. convert narrow: the input's
#   values as `dtype` (si32 or ui32) in `shape` (the same element count, row-major), the host refusing any value
#   outside the type's range (the range check); `fits: ui16` adds that every value fits ui16, the key type ttnn.sort
#   takes at the pin (spike, Compile probe at the pin). convert digits (`digits`, `bias`): an i64 input as bf16
#   columns of 8-bit digits, column k holding ((v + bias) >> 8k) & 255 for k < digits, then zero columns up to
#   shape[1] (a multiple of 32), the host refusing v + bias outside [0, 256**digits); bf16 holds every integer to 256
#   exactly, and ttnn.embedding takes bf16 tables only (spike, section 3).
# - results: the function's results in order, each {name, dtype, shape, convert}. convert widen: written as the output
#   `output` in i64, in `output_shape` when given (a one-element result as a scalar), else `shape`. convert recombine
#   (`digits`, `bias`): bf16 digit columns back to i64, v = the sum of d_k * 256**k over the first `digits` columns,
#   minus bias, the host refusing a digit that is no integer in [0, 255]. convert trim (`length`, `at_most`): a padded
#   result whose first n elements are the output, n the value of the result named by `length` (convert length, si32
#   [1], written to no file), the host refusing n outside [0, shape[0]]; shape[0] is at least the element count of
#   the input named by `at_most`, the most entries the output can have.
# Converting the files is the TT-NN executor's work (task P17.58); tests/bench/test_bale_ttnn_suite.py checks every
# contract against its item's declared inputs and these rules. sssp and toposort declare the boundary of one module
# for the whole item; the host loop over rounds that the spike plans for them is task P17.58's.
# Fetch with `uv run tools/fetch_bench.py assets/bench/bale-v0-ttnn.yaml` (bale's serial C files, as for bale-v0-tt);
# every item comment below is bale-v0-tt.yaml's, copied with its item.
