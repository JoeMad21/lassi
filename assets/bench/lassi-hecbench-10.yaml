# LASSI's HeCBench suite (bible Benchmark Suites: natural OpenMP and CUDA pairs, eval only).
# Sources are pinned by commit and fetched by tools/fetch_bench.py under $LASSI_SCRATCH, never into git.
suite: lassi-hecbench-10
repo: https://github.com/zjin-lcf/HeCBench
# The newest commit on HeCBench master's first-parent line whose src/<app>-<omp|cuda>/main.* files are byte for
# byte the 20 *_main files of upstream LASSI at 74b4681 (plans/spikes/p1-hecbench-pin.md, Decision). Each sha256
# below is that of upstream's file; tools/fetch_bench.py refuses a fetch whose files differ.
commit: 692cba32c5744f6ef024cca59f65e9488edba8bf
# Per item: run_args are the arguments of upstream's experimental_setup docstring, exactly (its DNU entry is left
# out); passfail lists the languages whose program prints PASS or FAIL (bible Source Papers, LASSI quirk table);
# support maps a harness file in every build directory of the item to its path in the pinned sources.
items:
  atomicCost:
    split: eval
    run_args: ["1"]
    passfail: [omp, cuda]
    languages:
      omp:
        dir: src/atomicCost-omp
        files: [main.cpp]
        sha256: {main.cpp: 551a852d6b4f49b46a25115e5e2e9e415800902212cc866bcf3c0b5a78f8545a}
      cuda:
