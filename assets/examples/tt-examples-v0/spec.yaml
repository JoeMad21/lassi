# The spec of tt-examples-v0, the worked examples a cpp -> tt prompt may carry (OQ-083 (b), the owner's answer of
# 2026-10-25: tt-pairs-v0 is a development set, and prompt work steered by its outcomes is allowed). The build-error
# report of 2026-10-25 (results/build-errors-20261025/summary.md) shows the models writing the TT-Metalium host API
# from memory, an older one; these are complete host programs with their kernels at the pinned commit.
#
# tools/build_tt_examples.py builds the pack from the pinned tree (an install at $LASSI_TOOLCHAINS/<PREFIX_NAME>, or a
# directory `build_tt_examples.py fetch` filled from GitHub, each file checked against its git blob sha1) and writes
# MANIFEST.yaml beside this file. Only this spec and the manifest are tracked; the fragments hold tt-metal's text and
# are gitignored. A recipe carries the examples with its `examples` section (lassi.core.recipe EXAMPLES).
#
# Each entry is an example directory under the data set's root, with every code file under it, in the order a prompt
# shows them: the host program first, then its kernels, sorted. Agent Rule 5: each directory is in the include list
# of the data set below (never in its exclude list, which holds the five Tier A items and their duplicates), and the
# data set's rules 3 and 4 hold for every file (the tool refuses a hit).
pack: tt-examples-v0
pin: tt-metal
dataset: assets/train/tt-train-v0/dataset.yaml
examples:
  - directory: shard_data_rm
    files:
      - shard_data_rm.cpp
      - kernels/reader_sharded_rm.cpp
  - directory: add_2_integers_in_riscv
    files:
      - add_2_integers_in_riscv.cpp
      - kernels/reader_writer_add_in_riscv.cpp
