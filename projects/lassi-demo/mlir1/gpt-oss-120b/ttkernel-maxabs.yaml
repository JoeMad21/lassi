# The first C++ -> TT MLIR pass (task P17.36), with task P17.41's fixes: cpp -> ttkernel on tt-pairs-v0's items (the
# sibling suite tt-pairs-v0-ttkernel, assets/bench/tt-pairs-v0-ttkernel.yaml), the max_abs half. The model writes each
# kernel as a ttkernel MLIR module; ttkernel-ttmetal lowers it with the pinned tt-mlir (ttmlir-opt
# --convert-ttkernel-to-emitc, ttmlir-translate --ttkernel-to-cpp) and builds the item's tracked TT host program, a
# harness file: for eltwise_binary and eltwise_sfpu the ttkernel host program of task P17.37 (built under OQ-103 (a)),
# which passes each kernel's circular buffer indices as compile-time arguments. tt-pairs-v0 is a development set
# (OQ-083 (b)). Exploratory; every TT program runs on ttsim, a simulator. The reference is the item's tt program (the
# tt host program with the upstream kernels) on ttsim, and the oracle judges a candidate against it within the
# references' own agreement, as sweep7 judges cpp -> tt.
# gpt-oss-120b with sweep7/gpt-oss-120b's model settings (reasoning effort medium, a budget of 32768 tokens, timeout
# 3600 s; OQ-080, OQ-087), restated here since sweep7's chain carries the adversary stage, which this pass leaves
# out (tests/core/test_mlir1_recipes.py checks the settings are sweep7's). 3 samples, a correction cap of 8, the
# mismatch report and simulator-gap feedback on, and task P17.41's fixes: a verify error's correction carries the
# pinned dialect's definitions of the names it gives (dialect_lookup), and ttsim's coord_to_tile gap on a NOC
# coordinate comes back as an addressing error (loop.coord_gap_as_error).
# Before the run: `uv run tools/fetch_bench.py assets/bench/tt-pairs-v0-ttkernel.yaml` and
# `uv run tools/build_ttkernel_context.py fetch --dest <dir>` then `... build --tree <dir>` (the dialect pack, the
# definitions, and the worked example; only their manifests are tracked).
extends: ../../tier-a-rngd-maxabs.yaml  # the max_abs items, baseline_both, ttsim for TT, native for C++, from_baseline
model:
  id: furiosa-ai/gpt-oss-120b
  timeout_s: 3600
llm:
  sampling:
    max_tokens: 32768
    reasoning_effort: medium
extract:
  unfenced_file_lines: true  # as sweep2 on (sweep7's chain)
bench:
  suite: tt-pairs-v0-ttkernel  # eltwise_binary, eltwise_sfpu, and loopback, the max_abs items, from the parent
directions: [{source: cpp, target: ttkernel}]
prompts: tt-mlir-v0
toolchain:
  ttkernel: ttkernel-ttmetal  # the pinned tt-mlir tools, then the host program with the pinned clang++-20
executor:
  ttkernel: {kind: ttsim, arch: wormhole_b0, dispatch: slow}  # candidates run in the sandbox on ttsim, a simulator
context: [ttkernel-5f396fd6]  # the ttkernel dialect's ops at the pin, built by tools/build_ttkernel_context.py
examples: {pack: ttkernel-examples-5f396fd6, max_chars: 8000, prompts: [generate, correct]}
dialect_lookup: {defs: ttkernel-defs-5f396fd6, max_chars: 12000, nearest: 4}  # task P17.41: verify-error feedback
stages: [baseline, summarize_context, generate, compile_loop, run_loop, oracle]
trials: {n: 3}
loop: {max_corrections: 8, correct_on_mismatch: true, correct_on_sim_gap: true, coord_gap_as_error: true}
