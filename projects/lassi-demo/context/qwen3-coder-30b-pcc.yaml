# The TT context pass (owner direction of 2026-10-23): ../sweep3/qwen3-coder-30b-pcc.yaml with upstream's context stage
# for the TT target. summarize_context asks the model to summarize the tt-metalium-5280a9cf pack (the guide
# METALIUM_GUIDE.md's summary and TT-Metalium sections, then, declarations only, the tt-metalium headers
# tt-host-v0's generate.txt names, then, as many as fit 40 KiB, the headers defining types it names first and
# the rest of their includes after; generated by tools/build_tt_context.py) before generate.
# The stage summarizes the pack of each direction's target language, and the runner wants one for every target,
# so only cpp -> tt runs here: no C++ pack exists. Not runnable yet:
# the runner joins context packs only into a fragment prompt set, and tt-host-v0 is a template set, so a run is
# refused before any directory exists until the stages carry a pack under a template set
# (tests/prompts/test_tt_context_pack.py checks the refusal). Exploratory.
extends: ../sweep3/qwen3-coder-30b-pcc.yaml
directions: [{source: cpp, target: tt}]  # the pack serves tt only
context: [tt-metalium-5280a9cf]  # assets/context/tt-metalium-5280a9cf/, generated by tools/build_tt_context.py
stages: [baseline, summarize_context, generate, compile_loop, run_loop, oracle]  # the context stage before generate
