# sweep11 (task P17.45): bale-v0-tt, cpp -> ttkh, half b of its eight items, combination bale-rag: sweep10's bale-cpp-b
# (the worked examples alone) with retrieval over the tt-metal docs (tt-metal-docs: 4 passages, at most 6000 characters
# in all, at generation and at each compile or run-error correction), as sweep9's kh-allsk sets it. The model turns
# bale's serial C++ program into a whole TT-Metalium program (the host program and its kernel). The shared settings and
# their reasons are in ../../bale-tt-v1-base.yaml. Exploratory; every TT program runs on ttsim, a simulator.
extends: ../../bale-tt-v1-base.yaml
bench:
  items: [permute_matrix, sssp, toposort, randperm]
directions: [{source: cpp, target: ttkh}]
fixes:
  # The ttkh reference is this direction's own source, the serial program, so the baseline builds it once, as the
  # reference, and runs no second copy to compare with it (the omp recipes keep the fix on: OpenMP against serial).
  baseline_both: false
retrieval: {index: tt-metal-docs, k: 4, max_chars: 6000, prompts: [generate, correct]}
