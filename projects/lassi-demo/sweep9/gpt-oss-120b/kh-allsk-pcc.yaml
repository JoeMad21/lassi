# The ninth pass of the owner's RNGD sweep (task P17.39): C++ -> TT where the model writes the host program and every
# kernel (tt-pairs-v0-kh, a development set, OQ-083 (b)). Exploratory; every TT program runs on ttsim, a simulator.
# Combination kh-allsk: kh-exsk plus sweep7's all for this arm: the kernels pack (the guide, the host API, and the
# kernel API at the pin) with the declaration lookup, its core the host headers of buffers, circular buffers, and
# kernels and the kernel headers of the reader, writer, and compute calls (their declarations fit max_chars whole),
# retrieval over the tt-metal docs, the mismatch report, and a restart after 3 failed corrections in a row. No stage
# sends the whole pack (summarize_context).
extends: kh-exsk-pcc.yaml
context: [tt-metalium-5280a9cf-kh]  # tools/build_tt_context.py --kernels
lookup:
  max_chars: 32000
  prompts: [generate, correct]
  nearest: 3
  core:
  - tt-metalium/host_api.hpp
  - tt-metalium/distributed.hpp
  - tt-metalium/mesh_buffer.hpp
  - tt-metalium/buffer_types.hpp
  - tt-metalium/circular_buffer_config.hpp
  - tt-metalium/kernel_types.hpp
  - api/dataflow/dataflow_api.h
  - api/compute/common.h
  - api/compute/cb_api.h
  - api/compute/reg_api.h
  - api/compute/pack.h
  - api/compute/tile_move_copy.h
  - api/compute/compute_kernel_hw_startup.h
  - api/compute/eltwise_binary.h
  - api/compute/eltwise_unary/eltwise_unary.h
  - api/compute/matmul.h
retrieval: {index: tt-metal-docs, k: 4, max_chars: 6000, prompts: [generate, correct]}
loop: {restart_after: 3}
