# sweep21 (task P17.64), arm all: bale-ex-1.yaml (the worked examples) with sweep11's bale-all features, as sweep11's
# bale-all-cpp recipes set them: the template set bale-tt-v1, restarts after 3 failed corrections in a row or a
# repeated error set, the kernels pack tt-metalium-5280a9cf-kh with its declaration lookup, and retrieval over the
# tt-metal docs, for furiosa-ai/Qwen3-32B-FP8, items histo, ig. Exploratory; every TT program runs on ttsim, a
# simulator.
extends: bale-ex-1.yaml
prompts: bale-tt-v1  # bale-tt-v0 plus tt-kh-v0's pack, lookup, and retrieval frames
loop: {restart_after: 3, restart_on_repeat: true}
context: [tt-metalium-5280a9cf-kh]  # tools/build_tt_context.py --kernels
lookup:
  max_chars: 32000
  prompts: [generate, correct]
  nearest: 3
  core:
  - tt-metalium/host_api.hpp
  - tt-metalium/distributed.hpp
  - tt-metalium/mesh_buffer.hpp
  - tt-metalium/buffer_types.hpp
  - tt-metalium/circular_buffer_config.hpp
  - tt-metalium/kernel_types.hpp
  - api/dataflow/dataflow_api.h
  - api/compute/common.h
  - api/compute/cb_api.h
  - api/compute/reg_api.h
  - api/compute/pack.h
  - api/compute/tile_move_copy.h
  - api/compute/compute_kernel_hw_startup.h
  - api/compute/eltwise_binary.h
  - api/compute/eltwise_unary/eltwise_unary.h
  - api/compute/matmul.h
retrieval: {index: tt-metal-docs, k: 4, max_chars: 6000, prompts: [generate, correct]}
