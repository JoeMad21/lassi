# sweep18, RUN ON TTSIM WITH THE OUTPUT CHECK: the TTIR feature ladder for Llama-3.3-70B-Instruct-FP8-dynamic
# (v2026.4, 4 RNGD cards), rung l0, the bare LASSI loop (task P17.61; the owner, 2026-11-01: "consider minimum
# features tests for 70B. May be the case that the model needs more features to converge."). Each TTIR module compiles
# with the runtime build's tools for the recorded ttsim descriptor and runs through the driver on ttsim, a simulator
# (never performance); its outputs are checked against the item's declared tolerance, and run errors and mismatches
# come back as corrections within the cap of 8. Exploratory. The ladder: l0 the bare loop (tt-ttir-bare-v1); l1 adds
# the TTIR API reference; l2 adds retrieval over tt-mlir's TTIR tests; l3 adds the cgeist affine source. Everything
# else is sweep17's gpt-oss-120b arms, with Llama's own sampling settings and no reasoning setting.
extends: ../../../base.yaml  # projects/base.yaml: runs root, sandbox, and report choices
faithful: false  # an exploratory arm of this project; nothing reproduces an upstream run
model:
  backend: openai_compat  # the OpenAI-compatible server run.sh starts on port 8123
  id: furiosa-ai/Llama-3.3-70B-Instruct-FP8-dynamic
  timeout_s: 1800  # as sweep7's llama33-70b recipes
llm:
  sampling:
    temperature: 0.6  # the model's own generation_config.json at v2026.4
    top_p: 0.9  # the same file
    max_tokens: 8192  # not a reasoning model; as sweep7's llama33-70b recipes
extract:
  unfenced_file_lines: true  # as sweep13's recipes
bench:
  suite: tt-pairs-v0-ttir  # tt-pairs-v0's items unchanged, with a ttir language whose reference is tt
  split: unassigned  # every Tier A item stays unassigned until the owner assigns it (OQ-025)
  items: [eltwise_binary, eltwise_sfpu, matmul_multi_core]  # each judged by its declared tolerance
directions: [{source: cpp, target: ttir}]
prompts: tt-ttir-bare-v1  # the bare loop, with run-failure and mismatch corrections
toolchain:
  ttir: ttir-ttmetal-ttsim  # the runtime build's tools, lowering for the recorded ttsim descriptor
  tt: ttmetal-host  # the tt reference's toolchain (reference: tt)
  cpp: gcc-native  # the cpp reference's toolchain, for the references' agreement
fixes:
  baseline_both: true  # build and run both references
stages: [baseline, generate, compile_loop, run_loop, oracle]
executor:
  cpp: {kind: native}  # the cpp reference runs in the sandbox on the host CPU
  tt: {kind: ttsim, arch: wormhole_b0, dispatch: slow}  # the tt reference runs in the sandbox on ttsim, a simulator
  ttir: {kind: ttmlir-ttsim, arch: wormhole_b0, dispatch: slow}  # each flatbuffer runs through the driver on ttsim
oracle: {kind: binary_io, metric: from_item, threshold: from_item, shape: elements}  # the item's declared tolerance
trials: {n: 2}
loop: {max_corrections: 8, correct_on_mismatch: true}  # LASSI's correction loop; mismatches come back as corrections
