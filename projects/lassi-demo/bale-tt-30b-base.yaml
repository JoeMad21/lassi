# The settings shared by sweep21's bale-v0-tt recipes (task P17.64) (the owner, 2026-11-11: "I booked you 12am-5am
# EST. Go ahead and do more tests with BALE. I want BALE applications converted from C++ to TT-Metallium. You were
# able to do three applications, I want more of the BALE applications ready. Run them on the 30B models and if we have
# time, we'll do the other models."): all eight bale apps of bale-v0-tt, cpp -> ttkh, where the model turns bale's
# serial C++ program into a whole TT-Metalium program, the host program and its one kernel. Every setting is
# ../bale-tt-base.yaml's (sweep10, where the reasons are) but the model, its sampling, and the cpp direction with
# baseline_both off (as sweep10's cpp recipes have them): gpt-oss-120b's reasoning_effort and 32768-token budget are
# left out, since each sweep21 recipe names one of the six 30B-class models of sweep20 with sweep20's sampling for it;
# the default model below is the first, so this file loads as a recipe of its own. The direction is cpp -> ttkh, whose
# reference is the source itself, so baseline_both is off, as in sweep10's cpp recipes. Every bale-v0-tt item is
# unassigned until the owner assigns it (training, prompt tuning, and harvest are refused), so no result here is a
# held-out evaluation (Agent Rule 5). Exploratory; every TT program runs on ttsim, a simulator, never silicon; outputs
# must equal the serial program's exactly.
extends: base  # projects/base.yaml: sampling, runs root, sandbox, and report choices
faithful: false  # nothing here reproduces an upstream run
model:
  backend: openai_compat  # furiosa-llm's OpenAI-compatible server, which run.sh starts on port 8123
  id: furiosa-ai/Qwen3-Coder-30B-A3B-Instruct-FP8  # the default; each sweep21 recipe names its model
  timeout_s: 3600  # as sweep10's recipes
llm:
  sampling:
    temperature: 0.7  # the default model's, as sweep20 reads them; each recipe sets all three
    top_p: 0.8
    max_tokens: 8192
extract:
  unfenced_file_lines: true  # as sweep10's recipes
bench:
  suite: bale-v0-tt  # assets/bench/bale-v0-tt.yaml
  split: unassigned  # every bale-v0-tt item, unassigned until the owner assigns it
directions: [{source: cpp, target: ttkh}]
prompts: bale-tt-v0  # assets/prompts/bale-tt-v0/, as sweep10's recipes
toolchain:
  cpp: gcc-native  # the pinned host g++: the reference
  omp: gcc-openmp  # unused by cpp -> ttkh; kept as ../bale-tt-base.yaml has it
  ttkh: ttmetal-host  # compiles the host program; writes the kernel uncompiled at its path for the kernel JIT
executor:
  cpp: {kind: native}  # the reference runs in the sandbox on the host CPU
  omp: {kind: native}
  ttkh: {kind: ttsim, arch: wormhole_b0, dispatch: slow}  # candidates run in the sandbox on ttsim, a simulator
examples: {pack: tt-kh-examples-v0, max_chars: 32000, prompts: [generate, correct]}  # tools/build_tt_examples.py
sandbox:
  wall_s: 300
fixes:
  baseline_both: false  # the ttkh reference is the cpp source itself
stages: [baseline, generate, compile_loop, run_loop, oracle]
oracle: {kind: binary_io, metric: max_abs, threshold: 0}  # exact
trials: {n: 1}
loop: {max_corrections: 8, correct_on_mismatch: true, correct_on_sim_gap: true}
