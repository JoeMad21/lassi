# The sixth pass of the owner's RNGD sweep, the feature matrix (owner, 2026-10-23: "do separate tests for all
# combinations of features added to base LASSI"; 2026-10-25: "Try bigger models like GPT-OSS especially with the
# modifications"), run by plans/runs/rngd-sweep/matrix.sh in an owner's window. cpp -> tt only: the API reference
# pack serves the tt target only. The fuzzer adversary is in every recipe; it runs after the oracle and never feeds
# the loop. Exploratory, one sample; every TT program runs on ttsim, a simulator. Combination base: API
# reference off, retrieval off, mismatch report off.
# furiosa-ai/gpt-oss-120b at v2026.4. furiosa-llm 2026.4 serves GPT-OSS in its harmony format with no --reasoning-parser
# (developer.furiosa.ai v2026.4.0, gpt-oss): the reasoning comes back apart from the answer, and the backend
# reads the answer, message.content. The reasoning effort is the server's default: this recipe sets no
# llm.sampling.reasoning_effort, so openai_compat sends none and no record names the effort (OQ-080;
# gpt-oss-20b-low sets it). The reasoning counts against max_tokens, so the budget is 16384, as for the other reasoning
# models, and a request takes longer, so the timeout is 1800 s. A served backend checks no context: a server
# refusal is a ServingError that ends this recipe's run; a reply cut at the budget with no answer (a null content,
# finish_reason length) is the empty answer, as an empty content is, an S0 attempt that gets a correction. Otherwise the Qwen3-Coder-30B base.
extends: ../qwen3-coder-30b/base-pcc.yaml
model:
  id: furiosa-ai/gpt-oss-120b
  timeout_s: 1800
llm:
  sampling:
    max_tokens: 16384
