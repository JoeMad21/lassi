# LoRA on Qwen2.5-0.5B on a Wormhole card, second in the window's sequence (task P17.38; OQ-076: LoRA; OQ-100 (a)
# with (s2); OQ-102 (3a)). The closest recipe to upstream's single-chip one at this wheel (tt-blacksmith 002ebe47:
# Qwen2.5-0.5B, PEFT LoRA, bf16, at 128 tokens; plans/spikes/tt-training.md, Finding 1c), here on tt-train-v0 at its
# full record length, through the tt-xla wheel on card 0 (the ttxla trainer). Every number below is PROJECTED:
# arithmetic, or a workstation reading logged in the spike, never a measurement of a run.
#
# Before the run, once, in the window: uv run --extra cpu tools/prepare_train.py <this file> downloads the base into
# $HF_HOME/hub (about 1 GB at this revision, PROJECTED); the launcher's remote script does it before the sequence.
# lassi train never downloads.
#
# Data (PROJECTED, a workstation count): tt-train-v0's 8 records, the longest 3,058 tokens in the Qwen3 chat format;
# Qwen2.5's chat template adds a default system turn, so the longest may need about 3,104 here (the spike, Finding 2),
# and max_length is 3,104, a multiple of 32. A longer record is refused before any step, never cut.
#
# Arithmetic (PROJECTED). Parameters N = 494.0M (the safetensors header; the spike, Command 7). LoRA r 16 on every
# linear layer but the output layer: r x (in + out) over q (896 to 896), k and v (896 to 128), o, gate, up, and down
# (896 to 4,864 and back) is 366.6K a layer, 8.8M over 24 layers (1.8 percent of N).
# - Memory, one chip of 12 GiB: the frozen base in bf16 0.99 GB, the adapter's weights, gradients, and moments under
#   0.15 GB, the logits and their gradient at 3,104 x 151,936 in bf16 about 1.9 GB, and with per-block recompute only
#   each block's input kept: 3.6 to 7.8 GB in all (the spike's table), against 13.0 to 16.7 GB without recompute,
#   which would not fit; so gradient checkpointing is on. Whether recompute survives tt-mlir's compilation is not
#   known (the spike, Finding 2); an out-of-memory failure here is the finding.
# - Compute per step (one record padded to 3,104 positions): 6N per position with recompute (forward, backward for
#   the activations, forward again) is 9.2e12 FLOP, and attention about 2.5e12: about 1.2e13 FLOP. 16 steps are
#   1.9e14 FLOP: about 3 minutes at a sustained 1 TFLOP/s, 16 at 0.2 (the sustained rate on this stack is not known).
# - Time: the compile of a 24-layer training graph at 3,104 tokens is the larger unknown, 20 to 40 minutes by the
#   spike's estimate; so 25 to 60 minutes in all, and timeout_s 4500 (75 minutes) ends it as a hang past that.
base_model: Qwen/Qwen2.5-0.5B@060db6499f32faf8b98477b0a26969ef7d8b9987  # the Hub API's sha on 2026-10-26 (the spike)
method: sft  # the only method on silicon: RL rewards never execute there (Agent Rule 9)
weights: lora
lora: {r: 16, targets: all-linear}  # every linear layer but the output layer
trainer:
  kind: ttxla
  device: {kind: tenstorrent, indices: [0]}  # card 0 of the host (/dev/tenstorrent/0); one card per run
  steps: 16  # two passes over the 8 records, one record a step
  seed: 7
  batch_size: 1
  learning_rate: 0.0002  # LoRA wants a rate well above full fine-tuning's (bible Weight Modes, Basis)
  max_length: 3104  # every sequence padded to it; a longer record is refused, never cut
  timeout_s: 4500  # the worker's wall limit; past it the run is a hang, the card quarantined
  network: none  # the worker runs in its own empty network namespace: the wheel's Tracy client listens and
  # broadcasts from library load (plans/spikes/tt-perf.md); no default
  gradient_checkpointing: true  # recompute per block, without which the memory above does not fit one chip
  chat_format: true  # the tokenizer's chat template, the format hf_local serves in
data:
  corpus: tt-train-v0  # assets/train/tt-train-v0/manifest.json; records under $LASSI_SCRATCH/train-data
