# sweep17, COMPILE AND RUN ON TTSIM: cpp -> d2m on tt-pairs-v0-d2m, arm d2m-min (task P17.48; the owner's request
# for the owner's windows of 2026-10-31 and 2026-11-01). Every TT program runs on ttsim, a simulator: nothing here measures performance, and
# its wall times are simulator wall time (Agent Rule 2). Each output is checked against the item's declared tolerance
# in the suite manifest (OQ-115). Exploratory; tt-pairs-v0 is a development set (OQ-083 (b)).
# The d2m counterpart of ttir-min.yaml (its comments hold for the run: the runtime build's tools for the recorded
# ttsim descriptor, the ttmlir-ttsim executor, the references, the oracle against each item's declared tolerance,
# run_loop's corrections within
# the cap of 8): rung l1's features for D2M, the bare loop with the D2M API reference alone (verbatim_context,
# d2m-ref-5f396fd6), at temperature 1.0, 2 samples. A D2M module lowers through the same --ttir-to-ttmetal-pipeline
# to the same TT-Metal flatbuffer (sweep13's d2m arms), so d2m-ttmetal-ttsim and the executor run it as they run a
# TTIR module. tt-d2m-bare-v1 is tt-ttir-bare-v1 worded for D2M, with tt-d2m-v0's API reference wording
# (knowledge.txt), retrieval, and cgeist templates, none of which this arm renders but knowledge.txt.
# Items: eltwise_binary (max_abs 0.01), eltwise_sfpu (max_abs 0.05), loopback (max_abs 0: D2M has a load and a store,
# so loopback is a copy), and matmul_multi_core (pcc 0.97), sweep13's d2m items, each judged by its own tolerance
# (assets/bench/tt-pairs-v0-d2m.yaml).
# Before the run (on the build host): uv run tools/fetch_bench.py assets/bench/tt-pairs-v0-d2m.yaml; uv run
# tools/build_ttkernel_reference.py build --tree <tt-mlir src> --dialect d2m; and the installs ttir-min.yaml
# names.
extends: ../../../base.yaml  # projects/base.yaml: runs root, sandbox, and report choices
faithful: false  # an exploratory arm of this project; nothing reproduces an upstream run
model:
  backend: openai_compat  # the OpenAI-compatible server the sweep10 chain binds
  id: furiosa-ai/gpt-oss-120b
  timeout_s: 3600
llm:
  sampling:
    temperature: 1.0  # rung l1's temperature (sweep16)
    top_p: 1.0  # gpt-oss's README recommends 1.0 (sweep12)
    reasoning_effort: high
    max_tokens: 65536  # the reasoning counted in it (sweep12)
extract:
  unfenced_file_lines: true  # as sweep13's recipes
bench:
  suite: tt-pairs-v0-d2m  # tt-pairs-v0's items unchanged, with a d2m language whose reference is tt
  split: unassigned  # every Tier A item stays unassigned until the owner assigns it (OQ-025)
  items: [eltwise_binary, eltwise_sfpu, loopback, matmul_multi_core]  # each judged by its declared tolerance
directions: [{source: cpp, target: d2m}]
prompts: tt-d2m-bare-v1  # the bare loop for D2M, with run-failure and mismatch corrections
context: [d2m-ref-5f396fd6]  # the exact API reference of the D2M dialect at the pin
toolchain:
  d2m: d2m-ttmetal-ttsim  # the runtime build's tools, lowering for the recorded ttsim descriptor
  tt: ttmetal-host  # the tt reference's toolchain (reference: tt): the pinned clang++-20 against the pinned tt-metal
  cpp: gcc-native  # the cpp reference's toolchain, for the references' agreement
fixes:
  baseline_both: true  # build and run both references, so the baseline records their agreement
stages: [baseline, verbatim_context, generate, compile_loop, run_loop, oracle]
executor:
  cpp: {kind: native}  # the cpp reference runs in the sandbox on the host CPU
  tt: {kind: ttsim, arch: wormhole_b0, dispatch: slow}  # the tt reference runs in the sandbox on ttsim, a simulator
  d2m: {kind: ttmlir-ttsim, arch: wormhole_b0, dispatch: slow}  # each flatbuffer runs through the driver on ttsim
oracle: {kind: binary_io, metric: from_item, threshold: from_item, shape: elements}  # the item's declared tolerance
trials: {n: 2}
loop: {max_corrections: 8, correct_on_mismatch: true}  # rung l1's cap; mismatches come back as corrections
