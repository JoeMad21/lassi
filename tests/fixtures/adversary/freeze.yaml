# owner's window of 2026-10-23 (the owner approved build-host work in the working session):
# - the witness checks, tests/bench/test_adv_seeded_remote.py, 30 passed (rx 20261022-212552-p16-witness-6488,
#   clean commit c5a9a1f): every reference clean and repeatable, every seeded candidate passing on the held-out
#   inputs and failing on its witness, so no candidate needed a fix;
# - the fuzzer's tests, tests/agents/test_fuzzer.py, 246 passed (rx 20261022-214701-p16-witness-b32e, clean commit
#   c5a9a1f), its known-answer sha256 among them, so lassi/agents/fuzzer.py gives the same bytes on Linux.
# tests/agents/test_freeze.py recomputes every value here and fails on any difference, and on a file added under a
# frozen directory. After the first adversary run on the set nothing here changes in response to a run: a changed
# adversary, candidate, or recorded value is measured only on a fresh seeded set frozen before the changed adversary
# first runs on it, or goes to the owner. A new recipe may join `recipes` as an addition (task P16.11).
# - files: the sha256 of each file's bytes (.gitattributes keeps every one LF, so the bytes are the same on every
#   host). Every file under a frozen directory is listed, README.md files excepted: prose that no code reads (the
#   registry reads the files a manifest names, prompts load <name>.txt, recordings are bound by path), whose
#   presence fixture tests check.
# - witnesses: per candidate id, the sha256 of its index entry's `witness` value alone, serialized as
#   json.dumps(witness, sort_keys=True, separators=(",", ":")) and encoded as ASCII. The spec is enough: the code that
#   turns it into input bytes, lassi/agents/llm.py (parse_reply) and lassi/harness/lassi_io.py (write_inputs), is
#   frozen above, and index.json itself is frozen too.
# - recipes: each projects/adversary-seeded/ recipe's resolved adversary section (seed, budget, and, for the llm
#   adversary, its backend, model, prompts, recording and its sha256, and sampling) as canonical JSON, its oracle
#   metric and threshold, its model.recording, and its trials.n.
