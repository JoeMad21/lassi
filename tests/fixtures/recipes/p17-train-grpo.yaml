# A train smoke recipe of gate part (a) (task P17.11; bible Build Roadmap, P17 row): `lassi train` runs grpo briefly on
# the CPU with a tiny model on SYNTHETIC data. It equals tests/train/trl_smoke.py smoke_recipe('grpo', 'lora'), the
# recipe CI's slow tests train (tests/train/test_smoke_recipes.py checks it). The runs root is $LASSI_RUNS_ROOT.
base_model: fixture:tiny-causal-lm  # tests/fixtures/train/tiny-causal-lm: random weights under the seed, no download
method: grpo  # group relative policy optimization
weights: lora  # a LoRA adapter trains; the base stays frozen
trainer:
  kind: trl  # the TRL backend (task P17.9)
  device: {kind: cpu}  # explicit device, no default
  steps: 2  # a brief run: two optimizer steps
  seed: 7  # the trainer's seed (bible Training Module, Compute)
  batch_size: 4  # four completions per step, in groups of two
  learning_rate: 0.001  # a smoke value; nothing here is tuned
  max_completion_length: 8  # tokens per sampled completion
lora:
  r: 8  # the adapter rank
  targets: all-linear  # every linear layer gets an adapter
rollout:
  engine: transformers  # in-process generation; executes nothing (Agent Rule 6)
  group_size: 2  # completions per prompt
data:
  synthetic: grpo-smoke.jsonl  # SYNTHETIC records under tests/fixtures/train/, outside every suite (Agent Rule 5)
