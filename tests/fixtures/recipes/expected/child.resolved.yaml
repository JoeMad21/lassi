  parquet: true
  trial_md: true
runs_root: fixture-runs
sandbox:
  mem_gb: 32
  network: false
  wall_s: 120
score: eval_metrics
stages:
- generate
- compile_loop
- run_loop
toolchain:
  cuda: fake_cc
  omp: fake_cxx
trials:
  n: 2
