# A refusal fixture of gate part (a) (task P17.11): on alpha01 `lassi run` of this recipe is refused before any
# directory exists, naming the device it lacks, and opens no device node (OQ-002). It is never meant to run.
# P17.G, if a GPU host is ever granted (OQ-040: none is planned), adds part (b)'s bindings (the gpu executor per
# language, the vendor profiler) and its own index choices.
# It is p17-cpu-hf.yaml with CUDA programs run by the gpu executor on NVIDIA GPU 0; alpha01 has no NVIDIA GPU
# (OQ-003), so the cuda probe finds no /dev/nvidiactl (lstat only).
extends: p17-cpu-hf.yaml  # the CPU recipe; only executor.cuda differs
executor:
  cuda: {kind: gpu, device: {kind: cuda, indices: [0]}}  # refused at executor.cuda.device: no NVIDIA node
